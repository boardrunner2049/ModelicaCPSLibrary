# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "Pololu 30:1 Metal Gearmotor 37Dx68L mm 12V with 64 CPR Encoder (Helical Pinion)"
kind = "gearmotor"
manufacturer = "Pololu"
source = "Pololu item #4752 product page and specs tab, https://www.pololu.com/product/4752 and https://www.pololu.com/product/4752/specs (fetched 2026-11-08)"
notes = "All figures at the gearbox output shaft. Encoder: 2-channel Hall quadrature, 64 CPR on motor shaft = 1920 counts per output rev (product page); encoder Vcc 3.5-20 V, max 10 mA. Stall torque/current are Pololu's theoretical extrapolations; stalling likely damages the motor. Pololu also states 6 V figures: 170 rpm, 0.15 A no-load, 3.0 A stall, 7.9 kg·cm stall ('will run at 6 V but is intended for 12 V'). Max-efficiency point @12V: 54 %, 280 rpm, 1.8 kg·cm, 0.78 A, 5.1 W output. Shaft 6 mm D, size 37D x 68L mm."
gear_ratio = 30.0               # specs tab 'Gear ratio: 30:1'; product page gives exact train (25×30×40)/(10×10×10) = 30 exactly
rated_voltage_v = 12.0          # specs tab 'Motor type: 12V'; all figures below '@ 12V'
no_load_speed_rpm = 330         # specs tab 'No-load speed @ 12V: 330 rpm'
no_load_current_a = 0.2         # specs tab 'No-load current @ 12V: 0.2 A'
stall_torque_kgcm = 14          # specs tab 'Stall torque @ 12V: 14 kg·cm' (190 oz·in on product page), extrapolated
stall_current_a = 5.5           # specs tab 'Stall current @ 12V: 5.5 A', extrapolated
max_power_w = 12                # specs tab 'Max output power @ 12V: 12 W'
weight_g = 200                  # specs tab 'Weight: 200 g'
