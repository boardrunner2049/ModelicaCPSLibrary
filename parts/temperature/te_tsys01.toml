# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "Measurement Specialties (TE) TSYS01"
kind = "temperature"
manufacturer = "TE Connectivity (Measurement Specialties)"
source = "TSYS01-FAMILY Digital Temperature Sensor datasheet, SENSOR SOLUTIONS /// TSYS01-FAMILY 09/2017, https://cdn.robotshop.com/media/b/blu/rb-blu-92/pdf/eng_ds_tsys01_a.pdf (te.com DocumentDelivery blocked automated download)"
notes = "Accuracy 1 requires VDD 3.2-3.4 V. TSYS01-1 variant: +/-0.1 C over -20..+70 C. Time constants measured on PCB 900 mm^2 x 1.5 mm FR4. Output word 24 bit (16/24-bit ADC value); temperature computed from ADC value with factory calibration coefficients."
accuracy_c = 0.1                              # +/-0.1 C for -5 < T < +50 C, VDD 3.2-3.4 V (TSYS01, Accuracy 1, p2)
accuracy_wide_c = 0.5                         # +/-0.5 C for -40 < T < +125 C, VDD 3.2-3.4 V (Accuracy 2, p2)
accuracy_bands = [[-5, 50, 0.1], [-40, 125, 0.5]]  # [from_c, to_c, +/- C] (p2)
resolution_c = 0.01                           # max (Temperature Resolution TRES, p2)
conversion_time_ms = 8.22                     # typ; min 7.40, max 9.04 (p2)
range_c = [-40, 125]                          # measurement range (p2)
adc_bits = 24                                 # output word (ADC section, p2)
psrr_c = 0.2                                  # max (p2)
time_constant_liquid_s = 3                    # t63, 25 C air -> 75 C liquid (p2)
time_constant_air_s = 4                       # t63, 25 C still air -> 75 C air stream 60 m/s (p2)
self_heating_c = 0.02                         # max, 10 samples/s, 60 s, still air (p2)
supply_voltage_v = [2.2, 3.6]                 # operating (p2)
current_ua = 12.5                             # max, 1 sample per second (p2)
current_peak_ma = 1.4                         # typ, during conversion (p2)
standby_current_ua = 0.02                     # typ at 25 C; max 0.14 (p2)
interface = "SPI (up to 20 MHz) or I2C, selected by PS pin"  # (p1-2)
not_stated = ["mass_g"]
