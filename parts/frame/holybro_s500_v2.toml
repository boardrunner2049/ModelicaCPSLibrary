# Published figures; tools/fire-compose/src/config.rs converts them (frame: armLength; arm_tube: mass.arm).
name = "Holybro S500 V2 frame"
kind = "frame"
manufacturer = "Holybro"
notes = """
The Holybro store and docs pages could not be read (HTTP 429, and the docs S500 page only has a CAD
file). Figures come from the PX4 user guide's S500 V2 build page and a UK retailer listing (Flyingtech),
which copies Holybro's text. The retailer does not say whether the 782 g weight is for the frame kit
alone or the ARTF kit (with motors, ESCs and props). The same page's JSON-LD gives 1 kg.
The arms are plastic (polyamide-nylon composite reinforced with carbon fibre rod), not carbon tubes.
"""

source = "Holybro S500 V2 Quadcopter Frame Kit (Flyingtech product page); cross-checked with PX4 User Guide 'Holybro S500 V2 + Pixhawk 4 Build' (v1.14), not stated on pages; accessed 2026-11-09, https://www.flyingtech.co.uk/product/holybro-s500-v2-quadcopter-frame-kit/"
wheelbase_mm = 480                # Flyingtech, "S500 V2 ARF Kit Contents": "Wheelbase:480mm"; PX4 guide hardware table: "Wheelbase: 480mm"
frame_mass_g = 782                # Flyingtech, "S500 V2 ARF Kit Contents": "Weight:782g" (scope not stated; see notes)
arm_count = 4                     # PX4 guide, Kit contents hardware table (arms, quantity 4)
arm_material = "Polyamide-Nylon composite reinforced with carbon fibre rod"  # Flyingtech Description: "The arms are made of high strength, ultra-durable Polyamide-Nylon composite material reinforced with carbon fibre rod"; ARF contents: "ARM adopts high strength plastics"
plate_thickness_mm = 1.5          # Flyingtech Description: "1.5mm top and bottom plates"
dimensions_mm = "383*385*240"     # Flyingtech ARF Kit Contents / PX4 guide: "Dimensions:383*385*240mm"
included_propeller = "1045"       # Flyingtech ARF Kit Contents: "Propeller 1045 (V2 Update)" (the kit's prop, not a stated maximum)
max_payload_g = 1500              # Flyingtech Description: "Payload: 1500g (without Battery, 70% Throttle)"

not_stated = [
  "arm_mass_g",
  "arm_tube_od_mm (arms are not tubes)",
  "arm_tube_id_mm / wall thickness",
  "arm_length_mm",
  "propeller_max_in",
  "center_plate_mass_g",
  "motor_mount_spacing",
  "what frame weight includes",
]
