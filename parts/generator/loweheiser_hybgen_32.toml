# Published figures; tools/fire-compose/src/payloads.rs converts them.
name = "Loweheiser HYBGEN 32 hybrid drone generator"
kind = "generator"
manufacturer = "Loweheiser"
source = "Loweheiser 'Hybrid drone generators' page, HYBGEN 32 spec table: https://www.loweheiser.com/hybrid-drone-generators/ (accessed 2026-11-09); ArduPilot page https://ardupilot.org/copter/docs/common-loweheiser-generator.html"
notes = "A 2-stroke 32 cc engine with a generator, supported by ArduPilot (GEN_TYPE Loweheiser). Fuel volume is entered in BATTy_CAPACITY (mL). The output voltage is listed as 'Confirm for selected configuration'; 'Supply voltage 12 S' is the battery/bus class. No peak rating is given."
rated_power_w = 2400                           # 'Max. electric output (continuous) 2400 W (12,500 RPM)'
rated_rpm = 12500
mass_g = 3700                                  # 'Weight 3,7 kg'
fuel_consumption_l_per_h = [1, 3]              # 'Fuel consumption 1 - 3 l/hr'
displacement_cc = 32
max_current_a = 50                             # 'Amps max 50 A'
bus = "12S"                                    # 'Supply voltage 12 S'
max_takeoff_mass_kg = 25                       # 'UAS max. take off weight 25 kg'
not_stated = ["peak_power_w", "output_voltage_v (numeric)", "runtime"]
