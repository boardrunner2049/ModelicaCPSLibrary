# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "EMAX MT2213 935KV"
kind = "motor"
manufacturer = "EMAX"
source = "EMAX official shop, product 'EMAX MT2213 935KV Multicopter Brushless Motor' (published 2022-05-30), description images QQ_20220530165924 (spec) and QQ_20220530165947 (test table), https://shop.emaxmodel.com/products/emax-mt2213-935kv-multicopter-brushless-motor (retrieved 2026-11-08)"
notes = "Spec and test data are images on the manufacturer's shop page, not a PDF datasheet. Test table is indexed by current steps, not throttle %; no throttle_pct given. Recommended pairing per EMAX: 3S + 1045 prop, 4S + 8045 prop (EMAX MT2213-des-1 image). Only the 11.1 V EMAX1045 block is recorded (the 3S/1045 recommendation); the same table also has 11.1 V EMAX8045 and 14.8 V EMAX8045 blocks. CONFLICTS: EMAX's older combo listing (emx-mt-1534..., 2020) shows a slightly different 11 V EMAX1045 table (e.g. 4 A -> 370 g, 9.6 A -> 670 g / 106 W / 6530 rpm, working temperature 43 C at the top row) and 'MAX THRUST 860G', whereas the 2022 page says 'Max. thrust 720g'. Another EMAX USA image labels the motor 'MT2213-920KV' with 28.0 mm/39.5 mm. Max thrust and 'ESC recommended 18A' are not mapped to keys. Internal resistance, idle current, max continuous current/power not published."
kv_rpm_per_v = 935                 # spec image "KV: 935KV"
stator_slots = 12                  # spec image "Framework: 12N14P"
magnet_poles = 14                  # spec image "Framework: 12N14P"
shaft_diameter_mm = 3              # spec image "Shaft: 3mm"
diameter_mm = 27.9                 # spec image "Diameter: 27.9mm"
length_mm = 39.7                   # spec image "Length: 39.7mm"
weight_g = 53                      # spec image "Weight: 53g" (with/without cables not stated)
cells_min = 3                      # spec image "No.of cells: 3-4S"
cells_max = 4                      # spec image "No.of cells: 3-4S"

