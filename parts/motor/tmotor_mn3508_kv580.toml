# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "T-MOTOR MN3508 KV580"
kind = "motor"
manufacturer = "T-MOTOR"
source = "T-MOTOR official store product page 'MN3508 Multirotor Fixed Wing UAV Motor KV380/KV580/KV700', Specification table + Test Data table, https://store.tmotor.com/goods.php?id=354 (retrieved 2026-11-08; no revision/date shown)"
notes = "Product page spec/test tables, not a PDF datasheet. KV580 test data published only at 14.8 V, three props (12*4CF, 13*4.4CF, 14*4.8CF); all rows included. Page's matching guide recommends T-MOTOR P15*5 prop / Air 20A ESC but no KV580 test row exists for P15*5. Operating temperature = motor surface temperature at 100% throttle after 10 min run (one value per prop, recorded on the 100% row). 'Max ... 180S' = 180 s rating."
kv_rpm_per_v = 580                 # Spec table "MN3508 KV580"
resistance_mohm = 110              # Spec table "Internal Resistance 110mΩ"; phase-to-phase vs phase not stated
no_load_current_a = 0.4            # Spec table "Idle Current@10v 0.4A"
no_load_current_at_v = 10          # Spec table "Idle Current@10v"
stator_slots = 12                  # Spec table "Configuration 12N14P"
magnet_poles = 14                  # Spec table "Configuration 12N14P"
stator_diameter_mm = 35            # Spec table "Stator Diameter 35mm"
stator_height_mm = 8               # Spec table "Stator Height 8mm"
shaft_diameter_mm = 4              # Spec table "Shaft Diameter 4mm"
weight_g = 82                      # Spec table "Weight Excluding Cables 82g"
weight_with_cables_g = 103         # Spec table "Weight Including Cables 103g"
max_continuous_current_a = 18      # Spec table "Max Continuous Current 180S 18A" (180 s)
max_power_w = 400                  # Spec table "Max Power (180S) 400W"
cells_min = 3                      # Spec table "No.of Cells(Lipo) 3-4S"
cells_max = 4                      # Spec table "No.of Cells(Lipo) 3-4S"

