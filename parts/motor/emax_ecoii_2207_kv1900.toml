# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "EMAX ECO II 2207 1900KV"
kind = "motor"
manufacturer = "EMAX"
source = "EMAX official shop, product 'Emax ECO II Series 2207 1700KV 1900KV 2400KV Brushless Motor' (published 2020-10-16): spec drawing image '2207-2020-10-29-2.jpg' (Specifications table, KV1900 block) and test image '2-ECOII2207-1900KV_25.2V_V1.0_-01.jpg' (V1.0), https://shop.emaxmodel.com/products/emax-eco-ii-series-2207-3-6s-1700kv-1900kv-2400kv-brushless-motor-for-rc-drone-fpv-racing (retrieved 2026-11-08)"
notes = "Chosen as the 5-inch racing motor because T-MOTOR F60PRO IV/V pages (store.tmotor.com -> shop.tmotor.com -> t-hobby.com) are behind a Cloudflare challenge and could not be read. Spec/test data are images on the manufacturer's shop page. Test table: 25.2 V (6S) only, rows at fixed thrust points (300/500/700 g) plus a full-power row whose speed column reads 'Max' (rpm omitted there); no throttle % given. EMAX names no single recommended prop (spec: 'Propeller 5\"-5.5\"'), so all six prop blocks are included. Peak current/max power are stated 'at 6S'; duration of the peak rating not stated. No ambient temperature, ESC or motor temperature given."
kv_rpm_per_v = 1900                # Specifications table, "KV1900"
resistance_mohm = 59               # Specifications "Internal Resistance 59mΩ"; phase-to-phase vs phase not stated
no_load_current_a = 1.4            # Specifications "Idle Current (10V) 1.4A"
no_load_current_at_v = 10          # Specifications "Idle Current (10V)"
stator_slots = 12                  # Specifications "Framework 12N14P"
magnet_poles = 14                  # Specifications "Framework 12N14P"
shaft_diameter_mm = 4              # Specifications "Bearing Shaft 4mm" (drawing shows M5 thread)
weight_g = 33.6                    # Specifications "33.6g (W/O Silicone Wire)"
peak_current_a = 45                # Specifications "Peak Current (6S) 45A"; duration not stated
max_power_w = 1130                 # Specifications "Max.Power (6S) 1130W"
cells_min = 3                      # Specifications "No.of cells 3-6S"
cells_max = 6                      # Specifications "No.of cells 3-6S"

