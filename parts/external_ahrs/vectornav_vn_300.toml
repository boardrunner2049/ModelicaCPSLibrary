# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "VectorNav VN-300"
kind = "external_ahrs"
manufacturer = "VectorNav Technologies"
source = "VN-300 Dual GNSS/INS Product Brief, Version 12-0026-R3, (c) 2024, https://vectornav.com/docs/default-source/product-brief/vn-300-product-brief.pdf"
notes = "Dual-antenna GNSS/INS; Rugged (45x44x11 mm) and SMD (24x22x3 mm). Figures from p2 tables. Footnotes: (1) magnetic heading needs proper declination/environment/hard-soft iron cal; (2) INS figures 'with sufficient motion for dynamic alignment'; (3) GNSS-dependent figures depend on SBAS, sky view, multipath, antenna, measurement duration; (5) free-inertial drift = typical rate of error growth after GNSS loss given full alignment. Position accuracy is standalone GNSS (SBAS-dependent); no RTK mode. A Navtech-hosted older brief lists gyro bias 5-7 deg/hr typ., accel bandwidth 260 Hz and Rugged current 250 mA; the official R3 values are used here."
heading_accuracy_magnetic_deg = 2.0             # Heading (Magnetic), RMS, fn1 (p2)
heading_accuracy_ins_dynamic_deg = 0.2          # Heading (INS), 1 sigma, fn2 (p2; p1 'Dynamic Heading Accuracy')
heading_accuracy_gnss_compass_0p5m_deg = [0.3, 0.6]    # GNSS-Compass, 0.5 m baseline, RMS range, fn3 (p2)
heading_accuracy_gnss_compass_1m_deg = [0.15, 0.3]     # GNSS-Compass, 1.0 m baseline, RMS range, fn3 (p2; p1 'Static Heading Accuracy 0.15 deg')
heading_accuracy_gnss_compass_2m_deg = [0.08, 0.15]    # GNSS-Compass, 2.0 m baseline, RMS range, fn3 (p2)
pitch_roll_accuracy_static_deg = 0.5            # Pitch/Roll (Static), RMS (p2)
pitch_roll_accuracy_dynamic_deg = 0.03          # Pitch/Roll (INS), 1 sigma, fn2 (p2)
heading_mounting_misalignment_deg = 0.15        # Rugged, 1 sigma, per-part constant, fn4 (p2)
pitch_roll_mounting_misalignment_deg = 0.1      # 1 sigma, fn4 (p2)
angular_resolution_deg = 0.001                  # p2
position_accuracy_horizontal_m = 1.0            # RMS, standalone GNSS, fn3 (p2)
position_accuracy_vertical_m = 1.5              # RMS, standalone GNSS, fn3 (p2)
free_inertial_position_drift_mps2 = 0.030       # "3.0 cm/s^2", typical, after GNSS loss (p2)
velocity_accuracy_mps = 0.05                    # "< 0.05 m/s" (upper bound) (p2)
output_rate_hz_max = 400                        # Position, Velocity & Attitude, up to 400 Hz (p2)
imu_output_rate_hz_max = 400                    # IMU, up to 400 Hz; contact VectorNav for higher (p2)
gyro_range_dps = 2000                           # p2
gyro_bias_instability_deg_per_hr = 10.0         # In-run (Allan) < 10 deg/hr (p2)
gyro_bias_instability_typ_deg_per_hr = 5.0      # "5 deg/hr typ." (p2)
gyro_noise_density_dps_per_rthz = 0.0035        # p2
gyro_bandwidth_hz = 265                         # p2
accel_range_g = 16                              # p2
accel_bias_instability_mg = 0.04                # In-run (Allan) < 0.04 mg (p2)
accel_noise_density_mg_per_rthz = 0.14          # "< 0.14 mg/sqrt(Hz)" (p2)
accel_bandwidth_hz = 230                        # p2
mag_range_gauss = 2.5                           # p2
mag_noise_density_ugauss_per_rthz = 140         # p2
gnss_channels = 72                              # 72 channel, L1C/A, L1OF, E1, B1I (p2)
gnss_ttff_cold_s = 29                           # p2
gnss_ttff_hot_s = 1                             # p2
gnss_pps_accuracy_ns_rms = 30                   # 30 ns RMS, 60 ns 99% (p2)
velocity_limit_mps = 500                        # p2
altitude_limit_m = 50000                        # p2
mass_g = 30                                     # Rugged (p2)
mass_smd_g = 5                                  # SMD (p2)
power_w = 1.25                                  # Rugged and SMD, excluding active antenna, fn8 (p2)
supply_voltage_v = [3.3, 14]                    # Rugged (p2); SMD 3.2-5.5 V
operating_temp_c = [-40, 85]                    # p2
not_stated = ["latency_ms", "RTK position accuracy (no RTK mode listed)"]
