# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "Inertial Labs INS-U"
kind = "external_ahrs"
manufacturer = "Inertial Labs"
source = "GPS-Aided INS-U / INS-U-OEM Datasheet Revision 2.19 (file served at https://inertiallabs.com/wp-content/uploads/2024/06/INS-U_Datasheet_rev2.13_Jan_2024.pdf; document body states Revision 2.19)"
notes = "INS + AHRS + air data computer, single-antenna GNSS (u-blox ZED-F9P or Septentrio mosaic-X5 options). Figures from p3 SPECIFICATIONS table. Footnotes: (1) RTK measured with 1 km baseline, patch antennas with good ground planes, ppm limited to baselines up to 20 km; (2) static heading in homogeneous magnetic environment, latitude up to +/-65 deg; (3) with GNSS aiding, 50% @ 30 m/s dynamic operation; (5) weight/size PN dependent. Accel figures depend on range option (A8/A15/A40)."
heading_accuracy_static_deg = 0.6              # Static accuracy (magnetic), RMS 1 sigma, fn2 (p3)
heading_accuracy_dynamic_gnss_deg = 0.3        # Dynamic accuracy (GNSS), RMS 1 sigma, fn3 (p3)
pitch_roll_accuracy_static_deg = 0.08          # Static accuracy in temperature range, 1 sigma (p3)
pitch_roll_accuracy_dynamic_deg = 0.05         # Dynamic accuracy, RMS 1 sigma, fn3 (p3)
angular_resolution_deg = 0.01                  # p3
position_accuracy_horizontal_m = 1.5           # Single point (SP), CEP (p3)
position_accuracy_rtk_horizontal_m = 0.01      # RTK, "0.01 + 1 ppm" CEP, fn1 (p3)
position_accuracy_rtk_vertical_m = 0.01        # RTK, "0.01 + 1 ppm" CEP, fn1 (p3)
velocity_accuracy_mps = 0.05                   # CEP (p3)
output_rate_hz_max = 200                       # Update rate 1...200 Hz, user settable (p3)
startup_time_s = 1                             # "< 1 s" (p3)
gyro_range_dps = 2000                          # p3
gyro_bias_instability_deg_per_hr = 2           # In-run (RMS, Allan variance), 1 sigma (p3)
gyro_arw_deg_per_rthr = 0.38                   # Angular random walk, 1 sigma (p3)
accel_range_g = [8, 15, 40]                    # range options (p3)
accel_bias_instability_mg = [0.01, 0.03, 0.05] # In-run (Allan), 1 sigma, for +/-8, 15, 40 g (p3)
accel_vrw_mps_per_rthr = [0.02, 0.045, 0.06]   # Velocity random walk, 1 sigma, for +/-8, 15, 40 g (p3)
mag_range_gauss = 8                            # embedded magnetometer (p3)
pressure_altitude_accuracy_m = 1               # -500 to 9000 m (p3)
airspeed_accuracy_mps = 0.5                    # p3
gnss_data_rate_hz_f9p = 10                     # u-blox ZED-F9P option (p3 GNSS table); mosaic-X5: 20 Hz
mass_g = 200                                   # "< 200" g, INS-U enclosed, PN dependent, fn5 (p3)
mass_oem_g = 100                               # "< 100" g, INS-U-OEM (p3)
dimensions_mm = [82, 40, 25.8]                 # INS-U; OEM 65 x 37.2 x 20.3 (p3)
power_w = 2                                    # "< 2 W" (p3)
supply_voltage_v = [5, 32]                     # p3
operating_temp_c = [-40, 85]                   # p3
not_stated = ["latency_ms", "gyro_noise_density (only ARW given)", "accel_noise_density (only VRW given)", "position_accuracy_vertical_m single-point"]
