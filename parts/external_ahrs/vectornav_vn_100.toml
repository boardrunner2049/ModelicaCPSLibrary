# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "VectorNav VN-100"
kind = "external_ahrs"
manufacturer = "VectorNav Technologies"
source = "VN-100 IMU/AHRS Product Brief, Version 12-0024-R3, (c) 2024, https://vectornav.com/docs/default-source/product-brief/vn-100-product-brief.pdf"
notes = "Two form factors: Rugged (36x33x9 mm) and SMD (24x22x3 mm); IMU specs shared. AHRS only (no GNSS), so no position/velocity accuracy. All figures from p2 'Performance Specifications'/'IMU Specifications' tables unless noted. Footnote 1: heading needs proper magnetic declination, suitable magnetic environment and valid hard/soft-iron calibration. Footnote 2 (dynamic pitch/roll): typical; velocity aiding required for sustained linear accelerations."
heading_accuracy_deg = 2.0                    # Heading (Magnetic), RMS, footnote 1 (p2, Performance Specifications)
pitch_roll_accuracy_static_deg = 0.5          # Pitch/Roll (Static), RMS (p2)
pitch_roll_accuracy_dynamic_deg = 1.0         # Pitch/Roll (Dynamic), RMS, typical, footnote 2 (p2)
angular_resolution_deg = 0.001                # p2
heave_accuracy_percent = 5.0                  # "5% or 5 cm" (p2)
heave_accuracy_m = 0.05                       # "5% or 5 cm" (p2)
delayed_heave_accuracy_percent = 2.0          # "2% or 2 cm" (p2)
delayed_heave_accuracy_m = 0.02               # "2% or 2 cm" (p2)
output_rate_hz_max = 400                      # Output Data Rate (Attitude), up to 400 Hz (p2; also p1 'Onboard EKF update rate')
imu_output_rate_hz_max = 800                  # Output Data Rate (IMU), up to 800 Hz; footnote 3: contact VectorNav for higher (p2)
gyro_range_dps = 2000                         # +/-2,000 deg/s (p2, IMU Specifications)
gyro_bias_instability_deg_per_hr = 10.0       # In-run bias stability (Allan variance) < 10 deg/hr (upper bound) (p2)
gyro_bias_instability_typ_deg_per_hr = 5.0    # "5 deg/hr typ." (p2)
gyro_noise_density_dps_per_rthz = 0.0035      # 0.0035 deg/s/sqrt(Hz) (p2)
gyro_bandwidth_hz = 265                       # p2
accel_range_g = 16                            # +/-16 g (p2)
accel_bias_instability_mg = 0.04              # In-run bias stability (Allan variance) < 0.04 mg (upper bound) (p2)
accel_noise_density_mg_per_rthz = 0.14        # 0.14 mg/sqrt(Hz) (p2)
accel_bandwidth_hz = 230                      # p2
mag_range_gauss = 2.5                         # +/-2.5 Gauss (p2)
mag_noise_density_ugauss_per_rthz = 140       # p2
baro_range_mbar = [10, 1200]                  # p2
mass_g = 15                                   # Rugged (p2, Mechanical)
mass_smd_g = 3.5                              # SMD (p2, Mechanical)
power_w = 0.220                               # Rugged, 40 mA @ 5 V (p2, Electrical)
power_smd_w = 0.185                           # SMD, 45 mA @ 3.3 V (p2, Electrical)
supply_voltage_v = [4.5, 5.5]                 # Rugged (p2); SMD 3.2-5.5 V
operating_temp_c = [-40, 85]                  # p2
not_stated = ["latency_ms", "position_accuracy_m", "velocity_accuracy_mps", "heading_accuracy_deg (dynamic, separately from magnetic)"]
