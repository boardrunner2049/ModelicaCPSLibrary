# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "MicroStrain 3DM-GX5-25"
kind = "external_ahrs"
manufacturer = "MicroStrain (Parker Hannifin / now HBK)"
source = "3DM-GX5-AHRS Product Datasheet, Document 8400-0093 Revision P (archived copy of https://microstrain.com/sites/default/files/GX5%20AHRS.pdf, Wayback 2024-09-25); cross-checked with Rev O (c)2020 (https://metromatics.com.au/wp-content/uploads/2024/04/3dm-gx5-ahrs.pdf) and Rev H (c)2018 (https://www.microstrain.com/sites/default/files/3dm-gx5-25_datasheet_8400-0093_1.pdf)"
notes = "AHRS (no GNSS). 3DM-GX5-25 is the AHRS model of the GX5 family; current datasheet is titled 3DM-GX5-AHRS. All figures p2 Specifications table. Accuracies labelled 'typ'. Rev H differs: accel noise 25 ug/sqrt(Hz), mag range +/-2.5 Gauss, mag noise 100 uGauss/sqrt(Hz), mag sampling 50 Hz; Rev O/P values used here. Datasheet distinguishes EKF and complementary-filter (CF) outputs; no static vs dynamic split."
pitch_roll_accuracy_deg = 0.25               # EKF outputs, +/-0.25 deg RMS roll and pitch (typ) (p2, Computed Outputs)
heading_accuracy_deg = 0.8                   # EKF outputs, +/-0.8 deg RMS heading (typ), magnetic (p2)
pitch_roll_accuracy_cf_deg = 0.5             # Complementary filter outputs, +/-0.5 deg RMS (typ) (p2)
heading_accuracy_cf_deg = 1.5                # Complementary filter outputs, +/-1.5 deg RMS (typ) (p2)
attitude_repeatability_deg = 0.2             # typ (p2)
attitude_resolution_deg = 0.01               # "< 0.01 deg" (p2)
filter_update_rate_hz = 500                  # Calculation update rate (p2)
output_rate_hz_max = 500                     # EKF outputs 1-500 Hz (p2)
output_rate_cf_hz_max = 1000                 # CF outputs 1-1000 Hz (p2)
imu_output_rate_hz_max = 1000                # IMU data output rate 1 Hz to 1 kHz (p2)
gyro_range_dps = 300                         # standard; optional +/-75, +/-150, +/-900 (p2)
gyro_bias_instability_deg_per_hr = 8         # p2
gyro_noise_density_dps_per_rthz = 0.005      # 0.005 deg/s/sqrt(Hz) (300 deg/s range) (p2)
gyro_initial_bias_error_dps = 0.04           # +/-0.04 deg/s (p2)
gyro_bandwidth_hz = 250                      # p2
gyro_vibration_induced_noise_dps_rms_per_g_rms = 0.072  # p2
accel_range_g = 8                            # standard; optional +/-2, 4, 20, 40 g (p2)
accel_bias_instability_mg = 0.04             # +/-0.04 mg (p2)
accel_noise_density_ug_per_rthz = 20         # 20 ug/sqrt(Hz) (2 g range) (p2)
accel_initial_bias_error_g = 0.002           # +/-0.002 g (p2)
accel_bandwidth_hz = 225                     # p2
mag_range_gauss = 8                          # p2
mag_noise_density_ugauss_per_rthz = 400      # p2
mass_g = 16.5                                # p2, Physical Specifications
dimensions_mm = [36.0, 36.6, 11.1]           # p2
power_w = 0.5                                # 500 mW typ (p2)
supply_voltage_v = [4, 36]                   # p2
operating_temp_c = [-40, 85]                 # p2
not_stated = ["latency_ms", "pitch_roll_accuracy static vs dynamic split", "position_accuracy_m", "velocity_accuracy_mps"]
