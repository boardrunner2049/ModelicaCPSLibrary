# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "Bosch Sensortec BMI088"
kind = "imu"
manufacturer = "Bosch Sensortec"
source = "BMI088 Data sheet, BST-BMI088-DS000-19 revision 1.9, January 2024, https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmi088-ds001.pdf"
notes = "Separate accelerometer and gyro dies. Accel noise at ±3 g, normal mode. The g-sensitivity and the accel offset tempco are bounds (max), not typical values."
gyro_full_scale_dps = 2000                  # Table 5, p10
gyro_full_scale_options_dps = [125, 250, 500, 1000, 2000]
accel_full_scale_g = 24                     # Table 4, p9
accel_full_scale_options_g = [3, 6, 12, 24]
gyro_adc_bits = 16
accel_adc_bits = 16
gyro_noise_density_dps_rthz = 0.014         # with the 0.1 dps RMS figure (47 Hz bandwidth)
gyro_rms_noise_dps = 0.1                    # 47 Hz bandwidth
accel_noise_density_ug_rthz = 160           # X/Y
accel_noise_density_z_ug_rthz = 190         # Z
gyro_zero_rate_offset_dps = 1               # ±, 25 C, offset cancellation off
gyro_zero_rate_tempco_dps_per_c = 0.015     # ±, -40..85 C
accel_zero_g_offset_mg = 20                 # typ, 25 C, ±6 g
accel_zero_g_tempco_mg_per_c = 0.2          # < 0.2 mg/K
gyro_sensitivity_tolerance_pct = 1          # ±
gyro_sensitivity_tempco_pct_per_c = 0.03    # ±
accel_sensitivity_tempco_pct_per_c = 0.002
gyro_cross_axis_pct = 1                     # ±
accel_cross_axis_pct = 0.5
gyro_nonlinearity_pct = 0.05                # % of full scale
accel_nonlinearity_pct = 0.5                # % of full scale
gyro_odr_max_hz = 2000
accel_odr_max_hz = 1600
gyro_linear_accel_sensitivity_dps_per_g = 0.1  # max
