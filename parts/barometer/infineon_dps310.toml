pressure_rms_noise_fast_mode = "single oversampling (Low Precision); 3.6 ms"
pressure_resolution_pa = 0.06                 # Table 7, p9 (max)
relative_accuracy_pa = 6                      # ±, any 1 hPa step in 800..1200 hPa, 20..60 C
absolute_accuracy_pa = 100                    # ±, 300..1200 hPa, 0..65 C
temperature_coefficient_offset_pa_per_k = 0.5 # Table 7, p9
solder_drift_pa = 80                          # Table 3, p6
temperature_accuracy_c = 0.5                  # ±
temperature_resolution_c = 0.01
odr_max_hz = 128                              # low oversampling only
conversion_time_lowest_noise_ms = 104.4       # 64x
