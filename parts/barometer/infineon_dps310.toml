# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "Infineon DPS310"
kind = "barometer"
manufacturer = "Infineon Technologies"
source = "DPS310 Data Sheet V1.2 (marked preliminary), 2020-10-15, https://community.infineon.com/gfawx74859/attachments/gfawx74859/KnowledgeBaseArticles/10104/3/Infineon-DPS310-DataSheet.pdf"
notes = "Long-term stability is ±1 hPa with no period given."
pressure_range_pa = [30000, 120000]           # Table 3, p6
pressure_rms_noise_pa = 0.2                   # 64x oversampling, High Precision (Table 7, p9)
pressure_rms_noise_mode = "64x oversampling (High Precision); 104.4 ms"
