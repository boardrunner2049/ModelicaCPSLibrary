# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "DJI 420 LITE ESC (E305)"
kind = "esc"
manufacturer = "DJI"
source = "DJI 'E305 Tuned Propulsion System User Manual' V1.0 2015.5, section 7 'Specifications' -> ESC (p.5), https://dl.djicdn.com/downloads/e305/en/E305_User_Manual_v1.00_en.pdf; size/cable length from archived DJI spec page https://web.archive.org/web/20210927050207/https://www.dji.com/e305/spec_v1-doc"
notes = "F450-class ESC (DJI lists F450/F550 as compatible platforms). Proprietary DJI firmware, 'square wave drive' (trapezoidal), throttle input: PWM, 3.3 V / 5 V compatible signal level, 30-450 Hz signal frequency. Max allowable voltage 17.4 V. No BEC mentioned. Size 54x24x9 mm, cable length 420 mm (web spec page). Motor PWM switching frequency, MOSFET part, dead time and capacitance are NOT published."
current_continuous_a = 20          # Manual p.5 "Max. Allowable Current (Persistent) 20 A"
current_burst_a = 30               # Manual p.5 "Max. Allowable Peak Current (3 seconds) 30 A"
burst_duration_s = 3               # Manual p.5 "(3 seconds)"
max_voltage_v = 17.4               # Manual p.5 "Max. Allowable Voltage 17.4 V"
cells_min = 3                      # Manual p.5 ESC "Battery 3S ~ 4S LiPo"
cells_max = 4                      # Manual p.5 ESC "Battery 3S ~ 4S LiPo"
firmware = "DJI proprietary (square wave drive)"  # Manual p.1 "About"
input_signal_hz_min = 30           # Manual p.5 "Signal Frequency 30 ~ 450 Hz"
input_signal_hz_max = 450          # Manual p.5 "Signal Frequency 30 ~ 450 Hz"
weight_g = 12.5                    # Manual p.5 "Weight (without cable) 12.5 g"
weight_with_cable_g = 27           # Manual p.5 "Weigh (with cable) 27 g"
