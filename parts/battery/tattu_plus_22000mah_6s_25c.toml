# Published figures; a smart (SMBus) pack: [peripherals.power_module] battery = ..., smart = true.
name = "Tattu Plus 22000mAh 6S 25C smart LiPo (AS150+XT150)"
kind = "battery"
smart = true                 # reports over SMBus
manufacturer = "Grepow (Tattu)"
source = "Gens Tattu official store product page, part TA-P2-25C-22000-6S1P-AS150, SKU TAA22K6SP25AX: https://genstattu.com/ta-p2-25c-22000-6s1p-as150.html (accessed 2026-11-09)"
notes = "Onboard BMS (Tattu Plus); the page does not state the bus protocol. Reseller weights range 2640-2650 g, consistent with this page. Grepow's comparison table lists 2063 g, which looks like an error or an old version. Derived: 25C x 22 Ah = 550 A continuous, 50C = 1100 A burst (not stated in amps)."
cells = 6
