max_continuous_discharge_c = 25                # 'Discharge Rate: 25C'
max_burst_discharge_c = 50                     # 'Max Burst discharge Rate (C): 50'
mass_g = 2650                                  # 'Net Weight(+/-20g): 2,650g'
size_mm = [213, 96, 69]
discharge_plug = "AS150+XT150"
balance_connector = "MOLEX-436450-9P"
wire_gauge_awg = 8
not_stated = ["internal_resistance_mohm", "max charge rate", "communication bus (SMBus/CAN) for ArduPilot"]
