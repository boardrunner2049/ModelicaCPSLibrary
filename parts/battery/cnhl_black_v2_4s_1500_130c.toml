# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "CNHL Black Series V2.0 1500mAh 4S 130C"
kind = "battery"
manufacturer = "CNHL (China Hobby Line)"
source = "ChinaHobbyLine product page (2-pack listing; specs are per pack), Stock Number 1501304BK, retrieved 2026-11-08, https://chinahobbyline.com/products/2-packs-cnhl-black-series-v2-0-1500mah-14-8v-4s-130c-lipo-battery-with-xt60-plug (reached via https://chinahobbyline.com/shop/detail/310, which formerly listed the original 100C Black Series)"
notes = "Racing/freestyle 4S pack. Size 39 x 28 x 80 mm (1-5 mm difference). XT60, JST-XH balance, 12 AWG. The older non-V2 Black Series 1500mAh 4S is 100C/200C (per retailers, not captured here). 'Normal cell voltage is between 3.7V~4.2V' -- 3.7 V is given as the low end of normal range, not explicitly as nominal; pack nominal 14.8 V / 4S = 3.7 V. NOT stated: cutoff voltage, burst duration, internal resistance."
chemistry = "LiPo"           # product page 'Lipo Battery'
cells_series = 4             # product page 'Voltage: 14.8V / 4-Cell / 4S1P'
