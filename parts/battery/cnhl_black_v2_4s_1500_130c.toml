cell_nominal_v = 3.7         # 14.8 V / 4S; also 'Normal cell voltage is between 3.7V~4.2V'
cell_full_v = 4.2            # product page 'Please stop charging immediately when the cell voltage has been charged to 4.2V'
c_rating_continuous = 130    # product page 'Discharge Rate: 130C Continual / 260C Burst'
c_rating_burst = 260         # product page 'Discharge Rate: 130C Continual / 260C Burst'
