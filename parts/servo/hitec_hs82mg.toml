# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "Hitec HS-82MG"
kind = "servo"
manufacturer = "Hitec"
source = "Hitec RCD USA product page 'HS-82MG 19g Metal Gear Analog Micro Servo' (Part # 32082S), 'HS-82MG Servo Specifications' table, https://hitecrcd.com/search/product_home/HS-82MG (fetched 2026-11-08)"
notes = "Hitec gives speed and torque as ranges '4.8V ~ 6.0V'; mapped low value to 4.8 V and high value to 6.0 V per Hitec convention. Travel/operating angle, pulse range and neutral are NOT stated on the page. Currents stated: idle 10 mA, no-load operating 280 mA, stall 1,800 mA (voltage not specified). Motor: 3-pole metal-brush ferrite; HT7003 analog SMT circuit; metal gears, no bearing."
speed_s_per_60deg = 0.10          # spec table 'Speed (Second @ 60°): 0.12 ~ 0.10' -> 0.10 at 6.0V end of 'Operating Voltage Range 4.8V ~ 6.0V'
speed_at_v = 6.0
speed_low_s_per_60deg = 0.12      # same row, 4.8V end
speed_low_at_v = 4.8
torque_kgcm = 3.4                 # spec table 'Maximum Torque Range kg. / cm.: 2.8 ~ 3.4' (6.0V end); oz-in 39 ~ 47
deadband_us = 5                   # spec table 'Dead Band Width: 5 µs'
voltage_min_v = 4.8               # spec table 'Operating Voltage Range (Volts DC): 4.8V ~ 6.0V'
voltage_max_v = 6.0
weight_g = 19.0                   # spec table 'Weight (Gram): 19.0'
digital = false                   # spec table 'Circuit Type: HT7003 Analog SMT'
