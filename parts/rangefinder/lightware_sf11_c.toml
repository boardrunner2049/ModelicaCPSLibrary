# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "LightWare SF11/C"
kind = "rangefinder"
manufacturer = "LightWare Optoelectronics (Pty) Ltd"
source = "SF11 Laser Altimeter Product Manual Revision 4 (2016), Appendix A Specifications p15 and laser radiation table p14, https://shop.mikrokopter.de/images/SF11ManualRev4.pdf ; LightWare SF11/C product sheet (via Acroname), https://acroname.com/sites/default/files/assets/gd1_t23_lightware_product_sheets_sf11.pdf"
notes = "Sources disagree on range: manual Rev 4 lists the SF11/C as '120 m' with range 0.1-120 m (natural targets); the later product sheet lists 0.2-100 m (current product is sold as SF11/C 100 m). range_max_m uses the product sheet value. Mass also differs: manual 35 g excluding cables; product sheet 29.96 g. The newest official LightWare manual (lightwarelidar.com) could not be retrieved. Laser table peak power '<10 W' (laser-safety AEL table, 50 mm aperture at 2 m) differs from Appendix A '20 W (peak)'."
range_min_m = 0.2                             # natural targets (product sheet); manual Rev 4 Appendix A states 0.1 m
range_max_m = 100.0                           # natural targets (product sheet); manual Rev 4 Appendix A states 120 m
range_max_rev4_manual_m = 120.0               # natural targets (manual Rev 4, Appendix A p15)
range_moving_water_m = [2.0, 40.0]            # moving water (manual Rev 4, Appendix A p15)
accuracy_m = 0.1                              # +/-0.1 m, 70% reflective target @ 20 C (Appendix A p15)
resolution_m = 0.01                           # (Appendix A p15)
update_rate_hz = 20                           # 20 readings per second (Appendix A p15; product sheet)
latency_max_ms = 65                           # max latency of serial/I2C/analog outputs (Appendix A p15)
beam_divergence_deg = 0.2                     # (Appendix A p15)
optical_aperture_mm = 51                      # (Appendix A p15)
wavelength_nm = 905                           # (laser radiation table p14)
laser_pulse_width_ns_max = 20                 # <20 ns (p14)
laser_pulse_frequency_khz_max = 36            # <36 kHz (p14)
laser_peak_power_w = 20                       # Appendix A p15 (Class 1M); p14 safety table gives <10 W AEL measurement
laser_average_power_mw_max = 15               # <15 mW average (Appendix A p15)
supply_voltage_v = [4.5, 5.5]                 # 5.0 V +/- 0.5 V DC (Appendix A p15)
current_ma = 200                              # maximum (Appendix A p15)
interface = "Serial, I2C (up to 400 kHz, 3.3 V TTL, 5 V tolerant), analog, micro USB"  # (Appendix A p15; product sheet)
operating_temperature_c = [0, 40]             # (Appendix A p15)
ip_rating = "IP40 unit, IP65 front face"      # (product sheet)
dimensions_mm = [30, 56.5, 50]                # (Appendix A p15); product sheet 30 x 56 x 50
mass_g = 35                                   # excluding cables (Appendix A p15); product sheet states 29.96 g
not_stated = ["fov_deg (only beam divergence)", "accuracy bands by distance", "current at idle", "max update rate other than 20 Hz"]
