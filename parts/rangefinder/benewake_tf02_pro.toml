# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "Benewake TF02-Pro"
kind = "rangefinder"
manufacturer = "Benewake (Beijing) Co., Ltd."
source = "TF02-Pro User Manual, REV 01/04/2024, Table 1-1 Technical Specification, https://en.benewake.com/uploadfiles/2025/04/20250430175509935.pdf"
notes = "Range/accuracy/resolution/repeatability determined with standard white board (90% reflectivity). FoV is 'a theoretical value, the actual angle value has some deviation'. Custom frame rate must be 2000/n Hz (n integer >= 2). Light source VCSEL, Class 1 (IEC60825). No overvoltage or reverse-polarity protection (Sec 2). Manual troubleshooting notes accuracy gets worse at 40 m against white board."
range_min_m = 0.1                             # all conditions (Table 1-1, p1)
range_max_m = 40.0                            # 90% reflectivity, 0 klux and 100 klux (Table 1-1, p1)
range_max_10pct_reflectivity_m = 13.5         # 10% reflectivity, 0 klux and 100 klux (Table 1-1, p1)
accuracy_m = 0.05                             # +/-5 cm, 0.1-5 m (Table 1-1)
accuracy_percent = 1.0                        # +/-1%, 5-40 m (Table 1-1)
accuracy_bands = [[0.1, 5.0, 0.05], [5.0, 40.0, 1.0]]  # first band meters, second band percent of distance (Table 1-1)
resolution_m = 0.01                           # (Table 1-1)
update_rate_hz = 100                          # default (Table 1-1, note 2)
update_rate_max_hz = 1000                     # adjustable 1-1000 Hz (Table 1-1)
repeatability_1sigma_m = 0.02                 # <2 cm, 0.1-35 m @90% reflectivity (Table 1-1)
ambient_light_immunity_klux = 100             # (Table 1-1)
fov_deg = 3.0                                 # theoretical value (Table 1-1, note 3; Sec 1.3)
spot_size_cm_at_m = [[1, 5], [2, 10], [3, 16], [5, 26], [7, 37], [10, 52], [20, 105], [30, 156], [40, 208]]  # [distance_m, square side cm] (Table 1-2, p3)
wavelength_nm = 850                           # central wavelength, VCSEL (Table 1-1)
supply_voltage_v = [5.0, 12.0]                # DC 5-12 V (Table 1-1)
current_ma = 200                              # average <=200 mA (Table 1-1)
current_peak_ma = 300                         # (Table 1-1)
power_w = 1.0                                 # <=1 W average (Table 1-1)
interface = "UART (LVTTL 3.3 V, default 115200 baud) / I2C (slave, <=400 kbps, default 0x10) / I/O"  # (Table 1-1, Sec 3)
operating_temperature_c = [-20, 60]           # (Table 1-1)
storage_temperature_c = [-30, 80]             # (Table 1-1)
ip_rating = "IP65"                            # (Table 1-1)
dimensions_mm = [69, 41.5, 26]                # L x H x W (Table 1-1)
mass_g = 50                                   # with cables (Table 1-1)
cable_length_m = 0.8                          # (Table 1-1)
not_stated = ["beam_divergence_deg (only FoV given)", "accuracy at 10% reflectivity"]
