# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "APC 9x4.7SF"
kind = "propeller"
manufacturer = "APC Propellers"
source = "PER3_9x47SF.dat (header: 9x4.7SF (9x47SF.dat) v2022-0915, Simulation Date: 09/22/2022), https://www.apcprop.com/files/PER3_9x47SF.dat; mass: https://www.apcprop.com/product/9x4-7sf/; RPM limit: https://www.apcprop.com/technical-information/rpm-limits/"
notes = "APC data are computed by APC's own blade element/vortex theory, not measured. Static rows are the V = 0 (J = 0) row of each PROP RPM block. Torque/thrust/power columns are printed by APC with 3 decimals, so low-RPM rows are coarsely rounded (Ct/Cp carry more precision). APC tabulates RPM blocks beyond its suggested max RPM; those rows are simulation output above the stated limit."
diameter_in = 9                # PER3_9x47SF.dat title line
pitch_in = 4.7                # PER3_9x47SF.dat title line
# blades = 2                  # NOT stated by APC (product page or data file); two-blade by APC Slow Flyer naming convention only, left commented out
mass_oz = 0.32               # product page "Product Weight 0.32 oz."
max_rpm = 7222               # APC RPM-limits page: SF "Maximum RPM=65,000/prop diameter (inches)" -> 65000/9 = 7222.2, truncated

