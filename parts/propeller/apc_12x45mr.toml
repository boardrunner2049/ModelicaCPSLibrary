# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "APC 12x4.5MR"
kind = "propeller"
manufacturer = "APC Propellers"
source = "PER3_12x45MR.dat (header: 12x4.5MR (12x45MR.dat) v2022-0915, Simulation Date: 09/22/2022), https://www.apcprop.com/files/PER3_12x45MR.dat; mass: https://www.apcprop.com/product/12x4-5mr/; RPM limit: https://www.apcprop.com/technical-information/rpm-limits/"
notes = "APC data are computed by APC's own blade element/vortex theory, not measured. Static rows are the V = 0 (J = 0) row of each PROP RPM block. Torque/thrust/power columns are printed by APC with 3 decimals, so low-RPM rows are coarsely rounded (Ct/Cp carry more precision). APC tabulates RPM blocks beyond its suggested max RPM; those rows are simulation output above the stated limit."
diameter_in = 12                # PER3_12x45MR.dat title line
pitch_in = 4.5                # PER3_12x45MR.dat title line
# blades = 2                  # NOT stated by APC (product page or data file); two-blade by APC Multi-Rotor naming convention only, left commented out
mass_oz = 0.78               # product page "Product Weight 0.78 oz."
max_rpm = 8750               # APC RPM-limits page: MR "Maximum RPM=105,000/prop diameter (inches)" -> 105000/12

