# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "APC 5x4.5E"
kind = "propeller"
manufacturer = "APC Propellers"
source = "PER3_5x45E.dat (header: 5x4.5E (5x45E.dat) v2022-0915, Simulation Date: 09/22/2022), https://www.apcprop.com/files/PER3_5x45E.dat; no apcprop.com product page found for 5x4.5E (https://www.apcprop.com/product/5x4-5e/ returns 404), so no mass"
notes = "APC data are computed by APC's own blade element/vortex theory, not measured. Static rows are the V = 0 (J = 0) row of each PROP RPM block. Torque/thrust/power columns are printed by APC with 3 decimals, so low-RPM rows are coarsely rounded (Ct/Cp carry more precision). APC tabulates RPM blocks beyond its suggested max RPM; those rows are simulation output above the stated limit. max_rpm omitted: APC RPM-limits page gives 190,000/D for Speed 400 Electric (E) and 150,000/D for Thin Electric (E); which family 5x4.5E belongs to is not stated."
diameter_in = 5                # PER3_5x45E.dat title line
pitch_in = 4.5                # PER3_5x45E.dat title line
