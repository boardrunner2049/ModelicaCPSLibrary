# Datasheet figures as published; tools/fire-compose/src/peripherals.rs converts them.
name = "Melexis US5881 (unipolar Hall switch)"
kind = "rpm"
manufacturer = "Melexis"
source = "US5881 Unipolar Hall Switch Low Sensitivity datasheet, REVISION 013 - November 2020 (3901005881), https://www.melexis.com/-/media/files/documents/datasheets/us5881-datasheet-melexis.pdf"
notes = "Unipolar SWITCH, not a latch (switches on one pole, releases when field drops below BRP). Electrical/magnetic figures at TA 25 C, VDD 12 V. Output polarity per pole differs between SE (TSOT) and UA (TO-92) packages (Table 5). Temperature range by suffix: E -40..85, K -40..125, L -40..150 C. Pulses per revolution depend on magnet arrangement (application-defined)."
max_frequency_hz = 10000                      # maximum switching frequency FSW 10 kHz (Table 3, p4)
rise_time_us = 0.25                           # RL 1 kohm, CL 20 pF (Table 3)
fall_time_us = 0.25                           # (Table 3)
operate_point_mt = [15, 25, 30]               # BOP min/typ/max (Table 4, p4)
release_point_mt = [9.5, 20, 28]              # BRP min/typ/max (Table 4)
hysteresis_mt = [2, 4.3, 5.5]                 # min/typ/max (Table 4)
supply_voltage_v = [3.5, 24]                  # operating (Table 3); abs max 28 V
current_ma = 2.5                              # typ; min 1.5, max 5, B < BRP (Table 3)
output = "open drain; VDSon 0.4 typ / 0.5 V max at 20 mA; abs max 50 mA"  # (Tables 1, 3)
operating_temperature_c = [-40, 150]          # L suffix (p3)
not_stated = ["response_time_us beyond rise/fall", "pulses_per_rev (application dependent)", "power-on time"]
