time_pulse_accuracy_ns = 30        # p6, RMS
cold_start_s = 26                  # p6, NEO-M8N/Q, GPS & GLONASS, -130 dBm
hot_start_s = 1                    # p6, NEO-M8N/Q
tracking_sensitivity_dbm = -167    # p6, good external LNA
max_dynamics_g = 4                 # p6, Airborne < 4 g platform
max_velocity_mps = 500
max_altitude_m = 50000
