# Datasheet figures as published; tools/fire-compose/src/parts.rs converts them.
name = "u-blox NEO-M8N"
kind = "gnss"
manufacturer = "u-blox"
source = "NEO-M8 u-blox M8 concurrent GNSS modules Data sheet, UBX-15031086 R14, 30-Sep-2025, https://content.u-blox.com/sites/default/files/NEO-M8-FW3_DataSheet_UBX-15031086.pdf"
notes = "Figures for the default GPS+GLONASS configuration and the NEO-M8N variant. Single-GNSS CEP: GPS 2.5 m, GLONASS 4 m, BeiDou 3 m, Galileo 3 m."
