# Pulse-output RPM sensor (milestone 5) on synthetic edge-level data.
#
# Reference device: Melexis US5881 Hall switch on a 12-magnet ring (pulses per
# revolution are the magnets: a configuration). Its datasheet states rise and
# fall times and a 10 kHz switching limit but no delay or jitter; the truth
# below is a synthetic choice. The reference is an encoder's true edge times on
# the same clock.

[experiment]
kind = "rpm"
name = "rpm_us5881_synthetic"
description = "Synthetic US5881 on a 12-magnet ring: event contract, edge delay and jitter, clock identifiability, angular-lag mismatch"
part = "melexis_us5881"
pulses_per_revolution = 12
unit = "SYNTHETIC-RPM-1 (generated by the PulseSensor model; not a device)"
label = "synthetic demonstration of the rpm pipeline; not a measured device"
synthetic = true
thresholds = "rpm_us5881_synthetic.thresholds.toml"

[truth]
edgeDelay = 0.00002        # 20 us
edgeJitterStd = 0.000003   # 3 us

[[datasets]]
name = "train_3000"
role = "train"
rpm = 3000
duration_s = 2
consumer_step_s = 0.01
seed = 1

[[datasets]]
name = "train_6000"
role = "train"
rpm = 6000
duration_s = 1
consumer_step_s = 0.01
seed = 2

[[datasets]]
name = "holdout_9000"
role = "holdout"
rpm = 9000
duration_s = 1
consumer_step_s = 0.002
phase = 0.0
seed = 3

[mismatch]                 # a field threshold: the edge lags a fixed angle, not a fixed time
angular_lag_pulses = 0.02
train = [{ name = "1500", rpm = 1500, duration_s = 2, seed = 11 },
         { name = "3000", rpm = 3000, duration_s = 2, seed = 12 },
         { name = "6000", rpm = 6000, duration_s = 1, seed = 13 }]
holdout = { name = "mismatch_holdout_12000", rpm = 12000, duration_s = 1, seed = 14 }
