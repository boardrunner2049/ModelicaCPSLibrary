# DPS310 pilot: the whole pipeline on synthetic data (milestone 3).
#
# Every dataset here is generated by the B1 model itself, or by a richer model
# for the mismatch test. It exercises the implementation and the experiment
# design; it says nothing about how a real DPS310 behaves. A real calibration
# replaces [truth] and the generated [[datasets]] with measured files
# (docs/sensor-calibration.md, "Data a real calibration needs").

[experiment]
name = "dps310_synthetic"
description = "Synthetic DPS310 unit: same-model recovery, identifiability and mismatch tests"
part = "infineon_dps310"
mode = "low_noise"
unit = "SYNTHETIC-UNIT-1 (generated by the B1 model; not a device)"
label = "synthetic demonstration of the calibration pipeline; not a measured device"
synthetic = true
thresholds = "dps310_synthetic.thresholds.toml"

# The generating parameters. samplePeriod, the quanta and the noise come from
# the datasheet-derived profile; these override or add to it.
[truth]
latencySamples = 2
pressureBias = 12.0           # Pa, inside the ±100 Pa typical absolute accuracy
temperatureBias = 0.3         # K, inside the ±0.5 K typical temperature accuracy
pressureNoiseStd = 0.2        # Pa, the datasheet's 64x figure
pressureDriftStd = 3.0        # Pa
pressureDriftTau = 60.0       # s: short enough for a 30 min record to resolve it
temperatureNoiseStd = 0.0

[[datasets]]
name = "train_steps"          # pressure steps: offset and latency
role = "train"
stimulus = "steps"
duration_s = 120
step_every_s = 10.05          # not a multiple of the sample period
step_pa = 100
pressure_pa = 100000
temperature_c = 25
seed = 11

[[datasets]]
name = "train_static"         # a static hold: noise and drift
role = "train"
stimulus = "static"
duration_s = 1800
pressure_pa = 100000
temperature_c = 25
seed = 12

[[datasets]]
name = "holdout_static"       # another pressure and temperature, another seed
role = "holdout"
stimulus = "static"
duration_s = 1800
pressure_pa = 95000
temperature_c = 40
seed = 21

[[datasets]]
name = "holdout_steps"
role = "holdout"
stimulus = "steps"
duration_s = 120
step_every_s = 7.3
step_pa = 200
pressure_pa = 95000
temperature_c = 40
seed = 22

[fit]
latency_candidates = [0, 1, 2, 3, 4]
pressure_bias_bounds_pa = [-200, 200]   # twice the ±100 Pa typical absolute accuracy
[fit.stochastic_bounds]                 # search ranges, not priors
sigma_w = [0.001, 10.0]
sigma_d = [0.001, 1000.0]
tau = [0.5, 100000.0]

[identifiability.short_record]
duration_s = 30
tau_s = 300
seed = 42

[mismatch]
temperature_coefficient_pa_per_k = 0.5  # DPS310 Table 7, typ.
[mismatch.train]
name = "mismatch_train"
stimulus = "temperature_ramp"
duration_s = 1800
pressure_pa = 100000
temperature_c = 15
temperature_end_c = 35
seed = 31
[mismatch.holdout]
name = "mismatch_holdout"
stimulus = "static"
duration_s = 1800
pressure_pa = 100000
temperature_c = 45
seed = 32
