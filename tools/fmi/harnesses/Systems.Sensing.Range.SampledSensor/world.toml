# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 4000000000
step = 5000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter overrides (kept by new_harness.py --refresh): 1..12 m window, 5 cm bias,
# noise 2 cm + 0.2 % of range, 1 cm LSB, 2 mm/K. samplePeriod / startTime stay at 20 ms / 0 s:
# with Rumoca 6058a2bb an override changes the reported epochs but not the sample() events.
[Models.m.Parameters]
minRange = 1.0
maxRange = 12.0
bias = 0.05
noiseStd = 0.02
noiseSlope = 0.002
quantum = 0.01
temperatureCoefficient = 0.002
seed = 7

[World.Inputs]
position_w_1 = "m.position_w[1]"
position_w_2 = "m.position_w[2]"
position_w_3 = "m.position_w[3]"
direction_w_1 = "m.direction_w[1]"
direction_w_2 = "m.direction_w[2]"
direction_w_3 = "m.direction_w[3]"
planenormal_w_1 = "m.planeNormal_w[1]"
planenormal_w_2 = "m.planeNormal_w[2]"
planenormal_w_3 = "m.planeNormal_w[3]"
planeoffset = "m.planeOffset"
sensortemperature = "m.sensorTemperature"
returnavailable = "m.returnAvailable"
deviceerror = "m.deviceError"
signalquality = "m.signalQuality"

[World.Outputs]
distance = "m.distance"
valid = "m.valid"
status = "m.status"
sampletime = "m.sampleTime"
deliverytime = "m.deliveryTime"
sequence = "m.sequence"
quality = "m.quality"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
