# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 3500000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[Models.m.Parameters]
"shaft.omega_start" = -2.0

[World.Inputs]
drivetorque = "m.driveTorque"
loadtorque = "m.loadTorque"

[World.Outputs]
omega = "m.omega"
acceleration = "m.acceleration"
frictionloss = "m.frictionLoss"
kineticenergy = "m.kineticEnergy"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
