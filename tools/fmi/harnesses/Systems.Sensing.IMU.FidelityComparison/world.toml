# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 3000000000
step = 250000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
r_wb_1 = "m.R_wb[1]"
r_wb_2 = "m.R_wb[2]"
r_wb_3 = "m.R_wb[3]"
r_wb_4 = "m.R_wb[4]"
r_wb_5 = "m.R_wb[5]"
r_wb_6 = "m.R_wb[6]"
r_wb_7 = "m.R_wb[7]"
r_wb_8 = "m.R_wb[8]"
r_wb_9 = "m.R_wb[9]"
a_w_1 = "m.a_w[1]"
a_w_2 = "m.a_w[2]"
a_w_3 = "m.a_w[3]"
gravity_w_1 = "m.gravity_w[1]"
gravity_w_2 = "m.gravity_w[2]"
gravity_w_3 = "m.gravity_w[3]"
omega_b_1 = "m.omega_b[1]"
omega_b_2 = "m.omega_b[2]"
omega_b_3 = "m.omega_b[3]"
alpha_b_1 = "m.alpha_b[1]"
alpha_b_2 = "m.alpha_b[2]"
alpha_b_3 = "m.alpha_b[3]"

[World.Outputs]

# Selected variables only (the whole model is ~2800 columns, 300 MB at 0.25 ms);
# new_harness.py --refresh resets this to models = ["m"].
[Trace]
every_step = true
variables = [
  "m.stat.sampleTime",
  "m.stat.deliveryTime",
  "m.stat.sequence",
  "m.stat.valid",
  "m.stat.acceleration",
  "m.stat.gyro",
  "m.stat.biasState[1]",
  "m.stat.biasState[2]",
  "m.stat.biasState[3]",
  "m.stat.biasState[4]",
  "m.stat.biasState[5]",
  "m.stat.biasState[6]",
  "m.digital.sampleTime",
  "m.digital.deliveryTime",
  "m.digital.sequence",
  "m.digital.valid",
  "m.digital.acceleration",
  "m.digital.gyro",
  "m.digital.biasState[1]",
  "m.digital.biasState[2]",
  "m.digital.biasState[3]",
  "m.digital.biasState[4]",
  "m.digital.biasState[5]",
  "m.digital.biasState[6]",
  "m.device.sampleTime",
  "m.device.deliveryTime",
  "m.device.sequence",
  "m.device.valid",
  "m.device.acceleration",
  "m.device.gyro",
  "m.device.biasState[1]",
  "m.device.biasState[2]",
  "m.device.biasState[3]",
  "m.device.biasState[4]",
  "m.device.biasState[5]",
  "m.device.biasState[6]",
  "m.errors.sampleTime",
  "m.errors.deliveryTime",
  "m.errors.sequence",
  "m.errors.valid",
  "m.errors.acceleration",
  "m.errors.gyro",
  "m.errors.biasState[1]",
  "m.errors.biasState[2]",
  "m.errors.biasState[3]",
  "m.errors.biasState[4]",
  "m.errors.biasState[5]",
  "m.errors.biasState[6]",
  "m.em.sampleTime",
  "m.em.deliveryTime",
  "m.em.sequence",
  "m.em.valid",
  "m.em.acceleration",
  "m.em.gyro",
  "m.em.biasState[1]",
  "m.em.biasState[2]",
  "m.em.biasState[3]",
  "m.em.biasState[4]",
  "m.em.biasState[5]",
  "m.em.biasState[6]",
  "m.acoustic.sampleTime",
  "m.acoustic.deliveryTime",
  "m.acoustic.sequence",
  "m.acoustic.valid",
  "m.acoustic.acceleration",
  "m.acoustic.gyro",
  "m.acoustic.biasState[1]",
  "m.acoustic.biasState[2]",
  "m.acoustic.biasState[3]",
  "m.acoustic.biasState[4]",
  "m.acoustic.biasState[5]",
  "m.acoustic.biasState[6]",
  "m.em.gyroLocked[1]",
  "m.em.gyroLocked[2]",
  "m.em.gyroLocked[3]",
  "m.ideal.acceleration",
  "m.ideal.gyro",
]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
