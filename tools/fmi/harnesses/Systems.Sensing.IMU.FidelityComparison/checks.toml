# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# The Systems.Sensing.IMU fidelity ladder under one motion (lib/imu_motion.h: level 1 s, then
# 0.5 rad/s roll), 2 ms output period, latency 1 sample (Wrapper.mo). stat, device, errors, em and
# acoustic share noiseStd (0.02 m/s2, 0.002 rad/s per sample/tick), a slow Gauss-Markov bias and
# the RNG stream, so they carry identical noise and bias; digital has none.
# Error budgets (documented by the models' structure, measured values with Rumoca 6058a2bb):
#   errors == device == acoustic exactly (ErrorSensor = DeviceSensor + equivalentError (0);
#     AcousticSensor = DeviceSensor + acoustic modes (pressure 0)).
#   device - stat: the device readout only, ADC LSB/2 (0.005 m/s2, 0.0005 rad/s) plus the 0.5 ms
#     analog lag while rolling (g W 0.5 ms = 2.5 mm/s2); measured max 6.8 mm/s2, 0.5 mrad/s.
#   em - stat: the MEMS physics only: accelerometer 3e-3 m/s2 (measured 1.2e-3), gyro 0.2 % of
#     rate (measured -0.07 %: 0.35 mrad/s at 0.5 rad/s) once the 3 ms demodulation filter settled.
#   digital vs truth: deterministic, LSB/2 + 0.7 ms lag curvature (measured 5.3 mm/s2); gyro exact.
#   stat vs truth: residual minus biasState is white noise of the configured std.
# Windows: stationary [0.02, 0.998] s, rolling [1.05, 3] s (after the rate step at t = 1).


[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "{m.stat.sampleTime} - 0.002*({m.stat.sequence} - 1)"
at = "all"
from = 0.002
near = 0.0
tol = 1e-09
why = "stat: sample epochs on the 2 ms grid, sampleTime = (sequence - 1) * 2 ms"

[[check]]
expr = "{m.stat.deliveryTime} - {m.stat.sampleTime}"
at = "all"
from = 0.002
near = 0.002
tol = 1e-09
why = "stat: latency 1: each sample is delivered one period after its acquisition"

[[check]]
variable = "m.stat.sequence"
at = "all"
to = 0.00175
near = 0.0
tol = 0.0
why = "stat: nothing is delivered before the first latency period (valid false, sequence 0)"

[[check]]
variable = "m.stat.valid"
at = "all"
from = 0.002
near = 1.0
tol = 0.0
why = "stat: valid from the first delivery on"

[[check]]
variable = "m.stat.sequence"
at = "end"
near = 1500.0
tol = 0.0
why = "stat: 1500 samples delivered by 3 s (1501 acquired, one in the queue)"

