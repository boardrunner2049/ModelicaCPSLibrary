# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Exact column names (m.x[3]) are used as is; patterns with several elements
# are globs, where a literal [ is written [[] (m.x[[][12]] = m.x[1], m.x[2]).
#
# QuadX plant, m = 1.5 kg, Izz = 0.04, g = 9.80665, start NED {0,0,-1} facing
# East (yaw psi = pi/2: body x East, body y South). IMU and magnetometer at
# the CG with sensor axes diag(1,-1,-1) relative to body FRD, so an FRD
# vector {x,y,z} reads {x,-y,-z}. Ambient field B_w = {20, 2, 45} uT NED;
# level, the magnetometer reads {Bn cos psi + Be sin psi,
# Bn sin psi - Be cos psi, -Bd}. Inputs are a zero-order hold, so the sample
# at t reflects inputs applied at t - 1 ms.
# Tilt manoeuvre: a rotation about the fixed body axis n = (1,1,0)/sqrt(2) by
# theta(t) (exact: Ixx = Iyy, no yaw rate), peak Theta = 14.1421 * 0.1^2 =
# 0.14142136 rad; collective f0/cos(theta) keeps the vertical thrust m g, so
# the horizontal thrust g tan(theta)/sqrt(2) acts on both North and East
# (negative: South-West). Horizontal velocity/position after the push and the
# tilt come from integrating that closed form (ws2/cf.py in the author's
# notes); the magnetometer under tilt is S^T Rot(n,Theta)^T Rz(pi/2)^T B_w.
# Override (world.toml): geometry.gnssPosition_C = (0.1, 0, -0.05) m, a GNSS
# antenna forward of and above the CG; GNSS position/velocity then carry the
# lever arm R_wb r and R_wb (omega x r).
# Native `rumoca sim` of the same profile (rtol 1e-9, continuous thrust)
# agrees with the FMU to < 1e-8 through the flight and to < 3e-7 m in the
# final slide position; checks that cite "native" use that reference.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

# --- hover --------------------------------------------------------------
[[check]]
variable = "m.measurements.acceleration[3]"
at = "0.15"
near = 9.80665
tol = 1e-9
why = "hovering accelerometer measures specific force g up (FRD -z, sensor +z)"

[[check]]
variable = "m.measurements.acceleration[[][12]]"
at = "0.15"
near = 0.0
tol = 1e-9
why = "level hover: no horizontal specific force"

[[check]]
variable = "m.measurements.magneticField[1]"
at = "0.15"
near = 2e-6
tol = 1e-12
why = "facing East, body x sees the East field component"

[[check]]
variable = "m.measurements.magneticField[2]"
at = "0.15"
near = 2e-5
tol = 1e-12
why = "body y is South; sensor y = -body y sees +North field"

[[check]]
variable = "m.measurements.magneticField[3]"
at = "0.15"
near = -4.5e-5
tol = 1e-12
why = "level: sensor z = -body z = -Down field"

[[check]]
variable = "m.measurements.altitude"
at = "0.15"
near = 1.0
tol = 1e-9
why = "barometer altitude is up-positive: -p_w[3]"

[[check]]
variable = "m.measurements.position[3]"
at = "0.15"
near = -1.05
tol = 1e-9
why = "GNSS reports the NED antenna position: CG at 1 m plus the 0.05 m mast (body -z = up while level)"

[[check]]
variable = "m.measurements.pressure"
at = "0.15"
near = 101325.0
tol = 1e-9
why = "ambient pressure passes through with zero bias"

[[check]]
variable = "m.measurements.temperature"
at = "0.15"
near = 288.15
tol = 1e-9
why = "ambient temperature passes through with zero bias"

