at = "all"
near = 0.0
tol = 1e-12
why = "GNSS position = p_w + R_wb r at every sample (lever arm r = (0.1, 0, -0.05) m through push, tilt, spin and landing)"

[[check]]
expr = "{m.measurements.position[2]} - {m.truth.p_w[2]} - ({m.truth.R_wb[4]}*0.1 + {m.truth.R_wb[5]}*0.0 + {m.truth.R_wb[6]}*-0.05)"
at = "all"
near = 0.0
tol = 1e-12
why = "GNSS position = p_w + R_wb r at every sample (lever arm r = (0.1, 0, -0.05) m through push, tilt, spin and landing)"

[[check]]
expr = "{m.measurements.position[3]} - {m.truth.p_w[3]} - ({m.truth.R_wb[7]}*0.1 + {m.truth.R_wb[8]}*0.0 + {m.truth.R_wb[9]}*-0.05)"
at = "all"
near = 0.0
tol = 1e-12
why = "GNSS position = p_w + R_wb r at every sample (lever arm r = (0.1, 0, -0.05) m through push, tilt, spin and landing)"

[[check]]
expr = "{m.measurements.velocity[1]} - {m.truth.v_w[1]} - ({m.truth.R_wb[1]}*({m.truth.omega_b[2]}*-0.05 - {m.truth.omega_b[3]}*0.0) + {m.truth.R_wb[2]}*({m.truth.omega_b[3]}*0.1 - {m.truth.omega_b[1]}*-0.05) + {m.truth.R_wb[3]}*({m.truth.omega_b[1]}*0.0 - {m.truth.omega_b[2]}*0.1))"
at = "all"
near = 0.0
tol = 1e-12
why = "GNSS velocity = v_w + R_wb (omega x r) at every sample"

[[check]]
expr = "{m.measurements.velocity[2]} - {m.truth.v_w[2]} - ({m.truth.R_wb[4]}*({m.truth.omega_b[2]}*-0.05 - {m.truth.omega_b[3]}*0.0) + {m.truth.R_wb[5]}*({m.truth.omega_b[3]}*0.1 - {m.truth.omega_b[1]}*-0.05) + {m.truth.R_wb[6]}*({m.truth.omega_b[1]}*0.0 - {m.truth.omega_b[2]}*0.1))"
at = "all"
near = 0.0
tol = 1e-12
why = "GNSS velocity = v_w + R_wb (omega x r) at every sample"

[[check]]
expr = "{m.measurements.velocity[3]} - {m.truth.v_w[3]} - ({m.truth.R_wb[7]}*({m.truth.omega_b[2]}*-0.05 - {m.truth.omega_b[3]}*0.0) + {m.truth.R_wb[8]}*({m.truth.omega_b[3]}*0.1 - {m.truth.omega_b[1]}*-0.05) + {m.truth.R_wb[9]}*({m.truth.omega_b[1]}*0.0 - {m.truth.omega_b[2]}*0.1))"
at = "all"
near = 0.0
tol = 1e-12
why = "GNSS velocity = v_w + R_wb (omega x r) at every sample"

[[check]]
