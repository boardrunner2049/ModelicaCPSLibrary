# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 3000000000
step = 400000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter overrides (kept by new_harness.py --refresh): 2 ms analog bandwidth, ADC LSB 0.01 m/s2 /
# 0.001 rad/s, 3 ms IIR. p.samplePeriod and p.adcDecimation stay at their defaults (1 ms, 1): with
# Rumoca 6058a2bb an override reaches tickPeriod but not the sample() clock.
[Models.m.Parameters]
"p.analogTau" = [0.002, 0.002, 0.002, 0.002, 0.002, 0.002]
"p.quantum" = [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
"p.digitalTau" = [0.003, 0.003, 0.003, 0.003, 0.003, 0.003]

[World.Inputs]
sensortemperature = "m.sensorTemperature"
r_wb_1 = "m.R_wb[1]"
r_wb_2 = "m.R_wb[2]"
r_wb_3 = "m.R_wb[3]"
r_wb_4 = "m.R_wb[4]"
r_wb_5 = "m.R_wb[5]"
r_wb_6 = "m.R_wb[6]"
r_wb_7 = "m.R_wb[7]"
r_wb_8 = "m.R_wb[8]"
r_wb_9 = "m.R_wb[9]"
a_w_1 = "m.a_w[1]"
a_w_2 = "m.a_w[2]"
a_w_3 = "m.a_w[3]"
gravity_w_1 = "m.gravity_w[1]"
gravity_w_2 = "m.gravity_w[2]"
gravity_w_3 = "m.gravity_w[3]"
omega_b_1 = "m.omega_b[1]"
omega_b_2 = "m.omega_b[2]"
omega_b_3 = "m.omega_b[3]"
alpha_b_1 = "m.alpha_b[1]"
alpha_b_2 = "m.alpha_b[2]"
alpha_b_3 = "m.alpha_b[3]"
equivalenterror_1 = "m.equivalentError[1]"
equivalenterror_2 = "m.equivalentError[2]"
equivalenterror_3 = "m.equivalentError[3]"
equivalenterror_4 = "m.equivalentError[4]"
equivalenterror_5 = "m.equivalentError[5]"
equivalenterror_6 = "m.equivalentError[6]"

[World.Outputs]
sampletime = "m.sampleTime"
deliverytime = "m.deliveryTime"
sequence = "m.sequence"
valid = "m.valid"
acceleration_1 = "m.acceleration[1]"
acceleration_2 = "m.acceleration[2]"
acceleration_3 = "m.acceleration[3]"
gyro_1 = "m.gyro[1]"
gyro_2 = "m.gyro[2]"
gyro_3 = "m.gyro[3]"
biasstate_1 = "m.biasState[1]"
biasstate_2 = "m.biasState[2]"
biasstate_3 = "m.biasState[3]"
biasstate_4 = "m.biasState[4]"
biasstate_5 = "m.biasState[5]"
biasstate_6 = "m.biasState[6]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
