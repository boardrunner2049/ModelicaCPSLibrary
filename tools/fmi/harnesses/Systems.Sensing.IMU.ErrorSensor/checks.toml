# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Systems.Sensing.IMU.ErrorSensor (I2), motion of lib/imu_motion.h (level 1 s, then roll 0.5 rad/s).
# Per channel j: drive_j = (1 + scale_j) truth_j + bias_j + tc_j (T - Tref) + equivalentError_j;
# 2 ms analog response; at each 1 ms tick ADC = round_LSB(analog + biasState_j + noiseStd_j n_j);
# 3 ms IIR (a = exp(-1/3)). Residual r_j = y_j - [(1 + scale_j) truth_j(sampleTime - 5 ms) + bias_j
# + tc_j (T - Tref)] - biasState_j (the readout lags ~5 ms, see the DigitalSensor harness) is the
# filtered noise: mean ~ 0, mean square = noiseStd^2 (1 - a)/(1 + a) + LSB^2/12
# (factor (1 - a)/(1 + a) = 0.1651: 0.05 m/s2 per tick -> 0.0203 m/s2 delivered).
# Temperature: T - Tref = 10 K -> +0.1 m/s2 on accel x, +0.01 rad/s on gyro z.
# equivalentError: accel y +1 m/s2 on [0.5, 0.7) s, excluded from the accel y stationary statistics.


[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "{m.sampleTime} - 0.001*({m.sequence} - 1)"
at = "all"
from = 1e-09
near = 0.0
tol = 1e-09
why = "sample epochs on the 1 ms grid: sampleTime = (sequence - 1) * samplePeriod, no drift"

[[check]]
expr = "{m.deliveryTime} - {m.sampleTime}"
at = "all"
from = 1e-09
near = 0.0
tol = 1e-09
why = "latency 0: delivered 0 period(s) after acquisition"

[[check]]
expr = "t - {m.deliveryTime}"
at = "all"
from = 1e-09
range = [-1e-09, 0.001]
why = "outputs are fresh: the delivery is less than one period old at every communication point"

[[check]]
variable = "m.valid"
at = "all"
from = 1e-09
near = 1.0
tol = 0.0
why = "every delivered sample is valid"

[[check]]
variable = "m.sequence"
at = "end"
near = 3001.0
tol = 0.0
why = "3001 samples delivered by t = 3 s: one per period"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.2) - {m.biasState[1]}"
at = "mean"
from = 0.05
to = 0.999
near = 0.0
tol = 0.01
why = "accel x, stationary: residual mean ~ 0 (zero-mean noise)"

[[check]]
expr = "({m.acceleration[1]} - (0 + 0.2) - {m.biasState[1]})**2"
at = "mean"
from = 0.05
to = 0.999
near = 0.0004212
rtol = 0.3
why = "accel x, stationary: residual mean square = expected noise variance 0.000421"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.2) - {m.biasState[1]}"
at = "all"
from = 0.05
to = 0.999
range = [-0.112614, 0.112614]
why = "accel x, stationary: |residual| < 5 sigma at every sample"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.2) - {m.biasState[1]}"
at = "mean"
from = 1.05
to = 3.0
near = 0.0
tol = 0.01
