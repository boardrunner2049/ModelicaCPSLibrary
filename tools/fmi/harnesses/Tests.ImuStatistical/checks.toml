[[check]]
expr = "({m.repeatA.acceleration[1]} - {m.repeatA.biasState[1]})**2"
at = "mean"
from = 0.001
near = 0.04
rtol = 0.15
why = "repeatA acceleration[1]: white noise (reading - biasState) has mean square noiseStd^2 = 0.04"

[[check]]
expr = "{m.repeatA.biasState[1]}**2"
at = "mean"
from = 0.001
near = 0.01
rtol = 0.6
why = "repeatA acceleration[1]: Gauss-Markov bias (tau 20 ms) has mean square biasStd^2 = 0.01 (about 25 correlation times)"

