[[check]]
expr = "abs({m.independent.acceleration[1]} - {m.repeatA.acceleration[1]})"
at = "mean"
from = 0.001
range = [0.15, 0.6]
why = "independent stream differs from repeatA on acceleration[1] (mean |difference| ~ 0.25: two independent 0.22-std signals)"

