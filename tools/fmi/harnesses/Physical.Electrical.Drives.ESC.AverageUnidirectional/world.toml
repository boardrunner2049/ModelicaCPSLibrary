# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 1600000000
step = 500000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
esccommand = "m.escCommand"
dcvoltage = "m.dcVoltage"

[World.Outputs]
omega = "m.omega"
current = "m.current"
backemf = "m.backEMF"
storedenergy = "m.storedEnergy"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
