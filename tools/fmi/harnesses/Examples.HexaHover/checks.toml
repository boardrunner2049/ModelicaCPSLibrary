# --- ideal sensors under tilt ----------------------------------------------

[[check]]
variable = "m.vehicle.measurements.acceleration[3]"
at = "all"
near = 9.80665
tol = 1e-09
why = "IMU at the CG reads the thrust specific force g on sensor z, nothing on x/y"

[[check]]
variable = "m.vehicle.measurements.acceleration[[][12]]"
at = "all"
near = 0.0
tol = 1e-09
why = "no horizontal specific force: gravity does not leak into the accelerometer under tilt"

[[check]]
expr = "{m.vehicle.measurements.gyro[1]} - {m.vehicle.truth.omega_b[1]}"
at = "all"
near = 0.0
tol = 1e-12
why = "gyro x = body roll rate"

[[check]]
expr = "{m.vehicle.measurements.gyro[2]} + {m.vehicle.truth.omega_b[2]}"
at = "all"
near = 0.0
tol = 1e-12
why = "gyro y = -body pitch rate (sensor y flip)"

[[check]]
variable = "m.vehicle.measurements.gyro[2]"
at = "1.0"
near = -1.061601003252839
tol = 1e-09
why = "gyro y closed form at 1 s"

[[check]]
