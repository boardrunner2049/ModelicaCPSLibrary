# Acceptance checks over out/trace.csv (see tools/check_trace.py).
#
# HexaHover (HexaX: 6 arms, radius 0.30 m, first arm at 30 deg) with a
# non-symmetric mount: world.toml overrides the tunable geometry.armMount so
# arm 1 sits at radius 0.31 m (same 30 deg direction), i.e. at
# (0.268468, -0.155000, 0) m in FRD; arms 2-6 are unchanged.
# The rotors still each carry T = m g/6 = 2.4516625 N at omega_h = 495.1426562
# rad/s, so the longer arm leaves a net moment
#   M = dr x (0,0,-T) = (0.012258313, 0.021232020, 0) N.m,
# about the horizontal body axis n_b = (0.500000, 0.866025, 0). Ixx = Iyy, so every
# horizontal axis is principal: the vehicle tips about the fixed axis n_b with
# constant alpha = |M|/Ixx = 1.225831250 rad/s^2, angle theta(t) = alpha t^2/2.
# Heading East (body x East, body y South), so n_w = (-0.866025, 0.500000, 0) NED
# and body z in world = (n_w x D) sin(theta) + D cos(theta) = R_wb[:,3].
# Total thrust stays m g along -body z: a_w = g D - g R_wb[:,3]; velocity and
# position below integrate that closed form (Simpson quadrature).
# Native `rumoca sim` of the same override agrees (see harness.c).

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

