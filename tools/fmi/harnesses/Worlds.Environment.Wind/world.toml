# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 1000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter override (kept by new_harness.py --refresh): 5 m/s horizontal
# wind toward the North-East with a 0.5 m/s updraft (NED: Up is negative z).
[Models.m.Parameters]
wind0 = [3.0, 4.0, -0.5]

[World.Inputs]

[World.Outputs]
wind_1 = "m.wind[1]"
wind_2 = "m.wind[2]"
wind_3 = "m.wind[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
