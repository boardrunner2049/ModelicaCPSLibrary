# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 1000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
active = "m.active"
normalforce = "m.normalForce"
velocitytangential_w_1 = "m.velocityTangential_w[1]"
velocitytangential_w_2 = "m.velocityTangential_w[2]"
velocitytangential_w_3 = "m.velocityTangential_w[3]"

[World.Outputs]
force_w_1 = "m.force_w[1]"
force_w_2 = "m.force_w[2]"
force_w_3 = "m.force_w[3]"
power = "m.power"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
