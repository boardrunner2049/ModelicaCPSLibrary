# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 2000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
u_1 = "m.u[1]"
acquisitionstatus = "m.acquisitionStatus"
acquisitionvalid = "m.acquisitionValid"

[World.Outputs]
y_1 = "m.y[1]"
status = "m.status"
valid = "m.valid"
sampletime = "m.sampleTime"
deliverytime = "m.deliveryTime"
sequence = "m.sequence"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
