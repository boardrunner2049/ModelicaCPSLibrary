# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Systems.Sensing.IMU.DeviceSensor (legacy I2), motion of lib/imu_motion.h (level 1 s, roll 0.5 rad/s).
# drive = (I + M_a) f + accelBias + tc (T - Tref) for the accelerometer, (I + M_g) omega + G f +
# gyroBias for the gyro, with M_a[1,2] = 0.01 and G[1,3] = 0.001 (rad/s)/(m/s2); 1 ms analog
# response; ADC = round_LSB(analog + noiseStd n) every 1 ms tick; no IIR.
# Residual r = y - drive(truth at sampleTime - 1.2 ms) is the per-tick noise plus LSB rounding:
# mean ~ 0, mean square = noiseStd^2 + LSB^2/12. The 1.2 ms is the analog lag plus the input hold.
# Stationary: accel x = 0.01*0 - 0.04, gyro x = 0.001*(-g) + 0.002 = -0.0078 rad/s (g-sensitivity),
# accel z = -g - 0.05 (T - Tref = -10 K at 0.005 m/s2/K).


[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "{m.sampleTime} - 0.001*({m.sequence} - 1)"
at = "all"
from = 1e-09
near = 0.0
tol = 1e-09
why = "sample epochs on the 1 ms grid: sampleTime = (sequence - 1) * samplePeriod, no drift"

[[check]]
expr = "{m.deliveryTime} - {m.sampleTime}"
at = "all"
from = 1e-09
near = 0.0
tol = 1e-09
why = "latency 0: delivered 0 period(s) after acquisition"

[[check]]
expr = "t - {m.deliveryTime}"
at = "all"
from = 1e-09
range = [-1e-09, 0.001]
why = "outputs are fresh: the delivery is less than one period old at every communication point"

[[check]]
variable = "m.valid"
at = "all"
from = 1e-09
near = 1.0
tol = 0.0
why = "every delivered sample is valid"

[[check]]
variable = "m.sequence"
at = "end"
near = 3001.0
tol = 0.0
why = "3001 samples delivered by t = 3 s: one per period"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.01*(-9.80665*sin(0.5*max(0, {m.sampleTime} - 1.0012))) + -0.04) - {m.biasState[1]}"
at = "mean"
from = 0.02
to = 0.999
near = 0.0
tol = 0.005
why = "accel x, stationary: residual mean ~ 0 (zero-mean noise)"

[[check]]
expr = "({m.acceleration[1]} - (0 + 0.01*(-9.80665*sin(0.5*max(0, {m.sampleTime} - 1.0012))) + -0.04) - {m.biasState[1]})**2"
at = "mean"
from = 0.02
to = 0.999
near = 0.0004021
rtol = 0.3
why = "accel x, stationary: residual mean square = expected noise variance 0.000402"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.01*(-9.80665*sin(0.5*max(0, {m.sampleTime} - 1.0012))) + -0.04) - {m.biasState[1]}"
at = "all"
from = 0.02
to = 0.999
range = [-0.10526, 0.10526]
why = "accel x, stationary: |residual| < 5 sigma at every sample"

