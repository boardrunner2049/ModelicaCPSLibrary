# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 1000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter override (kept by new_harness.py --refresh): Mars surface gravity.
# g is bound to the package constant Utilities.Constants.g = 9.80665; a compiler that
# folded that binding into the equation would still output 9.80665 here.
[Models.m.Parameters]
g = 3.71

[World.Inputs]

[World.Outputs]
gravity_1 = "m.gravity[1]"
gravity_2 = "m.gravity[2]"
gravity_3 = "m.gravity[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
