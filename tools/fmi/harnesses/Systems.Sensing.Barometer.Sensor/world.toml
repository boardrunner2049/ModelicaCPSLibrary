# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 20000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter overrides (kept by new_harness.py --refresh): fixed sensor biases.
[Models.m.Parameters]
pressureBias = 12.5
temperatureBias = -0.4
altitudeBias = 2.0

[World.Inputs]
ambientpressure = "m.ambientPressure"
ambienttemperature = "m.ambientTemperature"
altitude_w = "m.altitude_w"
climbrate_w = "m.climbRate_w"

[World.Outputs]
pressure = "m.pressure"
temperature = "m.temperature"
altitude = "m.altitude"
climbrate = "m.climbRate"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
