# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 5000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[Models.m.Parameters]
# 2 kg body, inertia with a product of inertia in the x-y plane (z principal),
# un-normalized start quaternion (2 x the ZYX roll 0.3 / pitch -0.2 / yaw 0.4
# attitude), body-frame start velocity and an elevated start position.
mass = 2.0
inertia = [0.1, 0.02, 0.0, 0.02, 0.2, 0.0, 0.0, 0.0, 0.3]
p_start = [1.0, 2.0, -50.0]
v_start = [1.0, 0.5, -2.0]
q_start = [1.92251256775338, 0.33067751598986206, -0.134408531166649, 0.420157296733859]

