# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 1000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
omega = "m.omega"
airvelocity_r_1 = "m.airVelocity_r[1]"
airvelocity_r_2 = "m.airVelocity_r[2]"
airvelocity_r_3 = "m.airVelocity_r[3]"
omegabody_r_1 = "m.omegaBody_r[1]"
omegabody_r_2 = "m.omegaBody_r[2]"
omegabody_r_3 = "m.omegaBody_r[3]"

[World.Outputs]
force_r_1 = "m.force_r[1]"
force_r_2 = "m.force_r[2]"
force_r_3 = "m.force_r[3]"
loadtorque = "m.loadTorque"
moment_r_1 = "m.moment_r[1]"
moment_r_2 = "m.moment_r[2]"
moment_r_3 = "m.moment_r[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
