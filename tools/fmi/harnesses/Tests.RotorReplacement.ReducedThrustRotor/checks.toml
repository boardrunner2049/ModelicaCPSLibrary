# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# kT = 0.5e-5 N.s2 (extends modifier), kQ = 1e-7 N.m.s2, spinSign = +1.
# Inputs held from t appear in the row at t + 1 ms.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.kT"
at = "all"
near = 0.5e-5
tol = 1e-20
why = "the replacement coefficient from the extends modifier is the simulated value (not the 1e-5 base default)"

[[check]]
expr = "{m.force_r[3]} - 0.5e-5 * {m.omega}**2"
at = "all"
near = 0.0
tol = 1e-12
why = "reduced thrust kT omega^2 with kT = 0.5e-5 in every row"

[[check]]
expr = "{m.loadTorque} - 1e-7 * {m.omega}**2"
at = "all"
near = 0.0
tol = 1e-15
why = "the replacement keeps the default torque coefficient kQ = 1e-7"

[[check]]
expr = "{m.moment_r[3]} + {m.loadTorque}"
at = "all"
near = 0.0
tol = 0.0
why = "spinSign +1: hub reaction moment -loadTorque about rotor +z"

[[check]]
expr = "abs({m.force_r[1]}) + abs({m.force_r[2]}) + abs({m.moment_r[1]}) + abs({m.moment_r[2]})"
at = "all"
near = 0.0
tol = 0.0
why = "axial wrench only; air velocity and body rate inputs are ignored"

[[check]]
variable = "m.force_r[3]"
at = "0.2"
near = 0.05
tol = 1e-15
why = "RotorReplacement operating point: 100 rad/s gives 0.05 N per rotor (4 x 0.05 = 0.2 N, the vehicle-level assert)"

[[check]]
variable = "m.moment_r[3]"
at = "0.2"
near = -0.001
tol = 1e-15
why = "kQ x 100^2 = 1e-3 N.m, negative about +z for spinSign +1"

[[check]]
variable = "m.force_r[3]"
at = "0.501"
near = 1.25
tol = 1e-12
why = "ramp midpoint 500 rad/s: 0.5e-5 x 500^2 = 1.25 N (half the default blade's 2.5 N)"

[[check]]
variable = "m.force_r[3]"
at = "0.8"
near = 4.05
tol = 1e-12
why = "900 rad/s: 4.05 N"

[[check]]
expr = "{m.loadTorque} / max({m.force_r[3]}, 1e-30)"
at = "all"
from = 0.11
to = 0.9
near = 0.02
tol = 1e-12
why = "torque/thrust ratio kQ/kT = 0.02 m doubles relative to the base blade"

[[check]]
variable = "m.force_r[3]"
at = "end"
near = 0.0
tol = 0.0
why = "stopped rotor: no thrust"
