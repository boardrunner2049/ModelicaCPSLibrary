# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Systems.Sensing.IMU.StatisticalSensor, motion of lib/imu_motion.h (level 1 s, then roll 0.5 rad/s).
# Delivered sample k (latency 0, 1 ms period) is acquired at sampleTime = (k-1)*1 ms:
#   y_j = (1 + scale_j)*truth_j(sampleTime) + bias_j + biasState_j + noiseStd_j*n_j
# truth = (0, -g sin(phi), -g cos(phi), W, 0, 0) with phi = 0.5*max(0, sampleTime - 1), W = 0.5 rad/s
# while rolling. The residual r_j = y_j - (1 + scale_j)*truth_j - bias_j - biasState_j is the white
# noise: its mean over ~1000 samples is within 5 sigma/sqrt(N) of 0 and its mean square within
# 15 % (about 3 standard errors) of noiseStd^2; |r| stays below 5 noiseStd. biasState (tau = 1000 s)
# stays within 4 biasStd and barely moves over 3 s. The first row (t = 0) is the initialized state:
# the t = 0 sample acquires the inputs' start values (R_wb = 0), so value checks start at 10 ms.
# Inputs are a zero-order hold over 0.4 ms communication steps, and a sample on a communication
# point acquires the inputs held over the step before it (the left limit), so the roll-rate step at
# t = 1 first shows in the 1.001 s sample: windows exclude that epoch. Attitude lag <= 0.4 ms
# (0.2 mrad, 2 mm/s2), well inside the noise.


[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "{m.sampleTime} - 0.001*({m.sequence} - 1)"
at = "all"
near = 0.0
tol = 1e-09
why = "sample epochs on the 1 ms grid: sampleTime = (sequence - 1) * samplePeriod, no drift over 3000 samples"

[[check]]
expr = "{m.deliveryTime} - {m.sampleTime}"
at = "all"
near = 0.0
tol = 1e-12
why = "latency 0: delivered at the acquisition epoch"

[[check]]
expr = "t - {m.deliveryTime}"
at = "all"
range = [-1e-09, 0.001]
why = "outputs are fresh: the delivered sample is less than one period old at every communication point"

[[check]]
variable = "m.valid"
at = "all"
near = 1.0
tol = 0.0
why = "every sample is valid (no latency to fill)"

[[check]]
variable = "m.sequence"
at = "end"
near = 3001.0
tol = 0.0
why = "3001 samples in 3 s (t = 0 included): one per period"

[[check]]
variable = "m.sequence"
at = 1.5
near = 1501.0
tol = 0.0
why = "1501 samples by t = 1.5 s"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.1) - {m.biasState[1]}"
at = "mean"
from = 0.01
to = 0.99
near = 0.0
tol = 0.008333
why = "accel x, stationary: residual mean ~ 0 (noise is zero-mean)"

[[check]]
expr = "({m.acceleration[1]} - (0 + 0.1) - {m.biasState[1]})**2"
at = "mean"
from = 0.01
to = 0.99
near = 0.0025000000000000005
rtol = 0.15
why = "accel x, stationary: residual mean square = noiseStd^2 = 0.0025"

[[check]]
expr = "{m.acceleration[1]} - (0 + 0.1) - {m.biasState[1]}"
at = "mean"
from = 1.01
to = 3.0
near = 0.0
tol = 0.008333
why = "accel x, rolling: residual mean ~ 0 (noise is zero-mean)"

[[check]]
expr = "({m.acceleration[1]} - (0 + 0.1) - {m.biasState[1]})**2"
at = "mean"
