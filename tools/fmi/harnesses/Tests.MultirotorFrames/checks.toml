# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Vehicle: aggregate mass 1.5 kg, inertia diag(0.02,0.02,0.04), CG at
# {0.03,-0.02,0.01} in C; gravity zero. Rotor 1 at {0.2,0.1,0} tilted so local
# +z is body +x (R_br = [0,0,1; 0,1,0; -1,0,0]), thrust 1.6 N, hub moment
# -0.024 N.m about local z; rotor 2 at {-0.1,0.05,0.05} untilted, 0.4 N, 0.006 N.m.
# By hand: F_b = {1.6,0,0.4}; arms from the CG r1 = {0.17,0.12,-0.01},
# r2 = {-0.13,0.07,0.04}; M_b = r1 x F1 + R_br1 Q1 + r2 x F2 + Q2
#     = (0,-0.016,-0.192) + (-0.024,0,0) + (0.028,0.052,0) + (0,0,0.006)
#     = {0.004, 0.036, -0.186}.
# Window 0-1 s: free tumble before the (gravity-free) drift brings the landing
# gear down at 3.63 s, where the model's own equality asserts stop holding.
#
# KNOWN FAILURE (suspected Rumoca bug, reported): chassis.inertia comes out
# with products of inertia -m r_j r_k of the aggregate's own r_C (about the
# chassis origin) instead of passing diag(0.02,0.02,0.04) through, so the
# initial angular acceleration is off too. Euler's equation is checked with
# the FMU's own inertia and passes, isolating the fault to the mass properties.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "norm({m.vehicle.force_b[1]} - 1.6, {m.vehicle.force_b[2]}, {m.vehicle.force_b[3]} - 0.4)"
at = "all"
range = [0.0, 1e-9]
why = "tilted rotor 1 maps local +z thrust to body +x; rotor 2 thrust stays along body +z"

[[check]]
expr = "norm({m.vehicle.moment_b[1]} - 0.004, {m.vehicle.moment_b[2]} - 0.036, {m.vehicle.moment_b[3]} + 0.186)"
at = "all"
range = [0.0, 1e-9]
why = "hub moments rotated by R_br once plus r x F about the combined CG (hand sum in the header)"

[[check]]
expr = "norm({m.vehicle.rotorPosition_b[1]} - 0.17, {m.vehicle.rotorPosition_b[2]} - 0.12, {m.vehicle.rotorPosition_b[3]} + 0.01, {m.vehicle.rotorPosition_b[4]} + 0.13, {m.vehicle.rotorPosition_b[5]} - 0.07, {m.vehicle.rotorPosition_b[6]} - 0.04)"
at = "end"
near = 0.0
tol = 1e-12
why = "rotor mounts rebased from C to the CG {0.03,-0.02,0.01}"

[[check]]
expr = "norm({m.vehicle.rotorMoment_b[1]} + 0.024, {m.vehicle.rotorMoment_b[2]} + 0.016, {m.vehicle.rotorMoment_b[3]} + 0.192)"
at = "end"
near = 0.0
tol = 1e-12
why = "rotor 1 moment row (row-major [i,k] -> 3(i-1)+k): R_br1*(0,0,-0.024) + r1 x (1.6,0,0) = (-0.024,-0.016,-0.192)"

[[check]]
expr = "norm({m.vehicle.rotorMoment_b[4]} - 0.028, {m.vehicle.rotorMoment_b[5]} - 0.052, {m.vehicle.rotorMoment_b[6]} - 0.006)"
at = "end"
near = 0.0
tol = 1e-12
why = "rotor 2 moment row: r2 x (0,0,0.4) + (0,0,0.006) = (0.028,0.052,0.006)"

[[check]]
variable = "m.vehicle.chassis.mass"
at = "end"
near = 1.5
tol = 1e-12
why = "aggregate mode keeps the 1.5 kg budget"

[[check]]
expr = "norm({m.vehicle.chassis.inertia[1]} - 0.02, {m.vehicle.chassis.inertia[5]} - 0.02, {m.vehicle.chassis.inertia[9]} - 0.04, {m.vehicle.chassis.inertia[2]}, {m.vehicle.chassis.inertia[3]}, {m.vehicle.chassis.inertia[6]})"
at = "end"
near = 0.0
tol = 1e-12
why = "a single aggregate part about its own CG: diag(0.02,0.02,0.04) must pass through untranslated"

[[check]]
expr = "norm({m.vehicle.body.alpha_b[1]} - 0.2, {m.vehicle.body.alpha_b[2]} - 1.8, {m.vehicle.body.alpha_b[3]} + 4.65)"
at = "0"
near = 0.0
tol = 1e-9
why = "at rest, alpha = I^-1 M = (0.004/0.02, 0.036/0.02, -0.186/0.04)"

[[check]]
expr = "norm({m.vehicle.body.a_w[1]} - ({m.vehicle.body.R_wb[1]}*1.6 + {m.vehicle.body.R_wb[2]}*0 + {m.vehicle.body.R_wb[3]}*0.4)/1.5, {m.vehicle.body.a_w[2]} - ({m.vehicle.body.R_wb[4]}*1.6 + {m.vehicle.body.R_wb[5]}*0 + {m.vehicle.body.R_wb[6]}*0.4)/1.5, {m.vehicle.body.a_w[3]} - ({m.vehicle.body.R_wb[7]}*1.6 + {m.vehicle.body.R_wb[8]}*0 + {m.vehicle.body.R_wb[9]}*0.4)/1.5)"
at = "all"
range = [0.0, 1e-9]
why = "Newton in world axes: a_w = R_wb F_b / m with zero gravity"

[[check]]
expr = "norm({m.vehicle.body.a_w[1]}, {m.vehicle.body.a_w[2]}, {m.vehicle.body.a_w[3]})"
at = "all"
range = [1.0994948, 1.0994950]
why = "|a| = |F_b|/m = sqrt(1.6^2+0.4^2)/1.5 = 1.0994949 m/s^2 whatever the attitude"

[[check]]
expr = "({m.vehicle.chassis.inertia[1]}*{m.vehicle.body.alpha_b[1]} + {m.vehicle.chassis.inertia[2]}*{m.vehicle.body.alpha_b[2]} + {m.vehicle.chassis.inertia[3]}*{m.vehicle.body.alpha_b[3]}) + {m.vehicle.body.omega_b[2]}*({m.vehicle.chassis.inertia[7]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[8]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[9]}*{m.vehicle.body.omega_b[3]}) - {m.vehicle.body.omega_b[3]}*({m.vehicle.chassis.inertia[4]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[5]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[6]}*{m.vehicle.body.omega_b[3]}) - (0.004)"
at = "all"
range = [-1e-9, 1e-9]
why = "Euler's equation component 1: I alpha + omega x (I omega) = M_b, with the FMU's own inertia"

[[check]]
expr = "({m.vehicle.chassis.inertia[4]}*{m.vehicle.body.alpha_b[1]} + {m.vehicle.chassis.inertia[5]}*{m.vehicle.body.alpha_b[2]} + {m.vehicle.chassis.inertia[6]}*{m.vehicle.body.alpha_b[3]}) + {m.vehicle.body.omega_b[3]}*({m.vehicle.chassis.inertia[1]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[2]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[3]}*{m.vehicle.body.omega_b[3]}) - {m.vehicle.body.omega_b[1]}*({m.vehicle.chassis.inertia[7]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[8]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[9]}*{m.vehicle.body.omega_b[3]}) - (0.036)"
at = "all"
range = [-1e-9, 1e-9]
why = "Euler's equation component 2: I alpha + omega x (I omega) = M_b, with the FMU's own inertia"

[[check]]
expr = "({m.vehicle.chassis.inertia[7]}*{m.vehicle.body.alpha_b[1]} + {m.vehicle.chassis.inertia[8]}*{m.vehicle.body.alpha_b[2]} + {m.vehicle.chassis.inertia[9]}*{m.vehicle.body.alpha_b[3]}) + {m.vehicle.body.omega_b[1]}*({m.vehicle.chassis.inertia[4]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[5]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[6]}*{m.vehicle.body.omega_b[3]}) - {m.vehicle.body.omega_b[2]}*({m.vehicle.chassis.inertia[1]}*{m.vehicle.body.omega_b[1]} + {m.vehicle.chassis.inertia[2]}*{m.vehicle.body.omega_b[2]} + {m.vehicle.chassis.inertia[3]}*{m.vehicle.body.omega_b[3]}) - (-0.186)"
at = "all"
range = [-1e-9, 1e-9]
why = "Euler's equation component 3: I alpha + omega x (I omega) = M_b, with the FMU's own inertia"

[[check]]
variable = "m.vehicle.gear.normalForce[[]*]"
at = "all"
near = 0.0
tol = 0
why = "landing gear clear of the ground throughout the window: no contact wrench pollutes the sums"

