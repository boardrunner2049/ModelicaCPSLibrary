# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 400000000
step = 100000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
voltage = "m.voltage"
currentzero = "m.currentZero"
loadtorque = "m.loadTorque"

[World.Outputs]
current = "m.current"
omega = "m.omega"
backemf = "m.backEMF"
electromagnetictorque = "m.electromagneticTorque"
copperloss = "m.copperLoss"
storedenergy = "m.storedEnergy"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
