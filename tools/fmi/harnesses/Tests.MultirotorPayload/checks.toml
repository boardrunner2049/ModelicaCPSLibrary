at = "all"
range = [0.0, 1e-8]
why = "torque-free rotation conserves the world-frame angular momentum R_wb I w"

[[check]]
expr = "0.5*({m.vehicle.body.omega_b[1]@0}*{m.vehicle.chassis.inertia[1]}*{m.vehicle.body.omega_b[1]@0} + {m.vehicle.body.omega_b[1]@0}*{m.vehicle.chassis.inertia[2]}*{m.vehicle.body.omega_b[2]@0} + {m.vehicle.body.omega_b[1]@0}*{m.vehicle.chassis.inertia[3]}*{m.vehicle.body.omega_b[3]@0} + {m.vehicle.body.omega_b[2]@0}*{m.vehicle.chassis.inertia[4]}*{m.vehicle.body.omega_b[1]@0} + {m.vehicle.body.omega_b[2]@0}*{m.vehicle.chassis.inertia[5]}*{m.vehicle.body.omega_b[2]@0} + {m.vehicle.body.omega_b[2]@0}*{m.vehicle.chassis.inertia[6]}*{m.vehicle.body.omega_b[3]@0} + {m.vehicle.body.omega_b[3]@0}*{m.vehicle.chassis.inertia[7]}*{m.vehicle.body.omega_b[1]@0} + {m.vehicle.body.omega_b[3]@0}*{m.vehicle.chassis.inertia[8]}*{m.vehicle.body.omega_b[2]@0} + {m.vehicle.body.omega_b[3]@0}*{m.vehicle.chassis.inertia[9]}*{m.vehicle.body.omega_b[3]@0})"
at = "end"
near = 0.57545
tol = 1e-12
why = "initial rotational energy 0.5 w' I w with the correct full tensor"

[[check]]
expr = "abs({m.vehicle.body.omega_b[1]@1.0} - 0.3) + abs({m.vehicle.body.omega_b[3]@1.0} - 0.8)"
at = "end"
range = [1e-4, 10]
why = "with a full (non-diagonal) inertia the body rates do precess: omega_b is not constant (non-vacuous dynamics)"

[[check]]
variable = "m.vehicle.gear.normalForce[[]*]"
at = "all"
near = 0.0
tol = 0
why = "the gear stays clear of the ground (1 m below the CG), so the motion is really force-free"
