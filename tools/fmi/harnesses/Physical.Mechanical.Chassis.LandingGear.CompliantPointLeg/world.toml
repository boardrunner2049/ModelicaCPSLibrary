# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 3600000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[Models.m.Parameters]
rLeg_b = [0.12, -0.08, 0.1]

[World.Inputs]
p_w_1 = "m.p_w[1]"
p_w_2 = "m.p_w[2]"
p_w_3 = "m.p_w[3]"
v_b_1 = "m.v_b[1]"
v_b_2 = "m.v_b[2]"
v_b_3 = "m.v_b[3]"
omega_b_1 = "m.omega_b[1]"
omega_b_2 = "m.omega_b[2]"
omega_b_3 = "m.omega_b[3]"
r_wb_1 = "m.R_wb[1]"
r_wb_2 = "m.R_wb[2]"
r_wb_3 = "m.R_wb[3]"
r_wb_4 = "m.R_wb[4]"
r_wb_5 = "m.R_wb[5]"
r_wb_6 = "m.R_wb[6]"
r_wb_7 = "m.R_wb[7]"
r_wb_8 = "m.R_wb[8]"
r_wb_9 = "m.R_wb[9]"
terrainpoint_w_1 = "m.terrainPoint_w[1]"
terrainpoint_w_2 = "m.terrainPoint_w[2]"
terrainpoint_w_3 = "m.terrainPoint_w[3]"
terrainnormal_w_1 = "m.terrainNormal_w[1]"
terrainnormal_w_2 = "m.terrainNormal_w[2]"
terrainnormal_w_3 = "m.terrainNormal_w[3]"
terrainvelocity_w_1 = "m.terrainVelocity_w[1]"
terrainvelocity_w_2 = "m.terrainVelocity_w[2]"
terrainvelocity_w_3 = "m.terrainVelocity_w[3]"

[World.Outputs]
force_b_1 = "m.force_b[1]"
force_b_2 = "m.force_b[2]"
force_b_3 = "m.force_b[3]"
moment_b_1 = "m.moment_b[1]"
moment_b_2 = "m.moment_b[2]"
moment_b_3 = "m.moment_b[3]"
contact = "m.contact"
gap = "m.gap"
normalforce = "m.normalForce"
force_w_1 = "m.force_w[1]"
force_w_2 = "m.force_w[2]"
force_w_3 = "m.force_w[3]"
tipposition_w_1 = "m.tipPosition_w[1]"
tipposition_w_2 = "m.tipPosition_w[2]"
tipposition_w_3 = "m.tipPosition_w[3]"
tipvelocity_w_1 = "m.tipVelocity_w[1]"
tipvelocity_w_2 = "m.tipVelocity_w[2]"
tipvelocity_w_3 = "m.tipVelocity_w[3]"
tangentialpower = "m.tangentialPower"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
