# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 1000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter overrides (kept by new_harness.py --refresh): the ISA state at
# 1000 m, density chosen as p/(R_air*T) with R_air = 287.053 J/(kg K).
[Models.m.Parameters]
temperature0 = 281.65
pressure0 = 89874.5625
density0 = 1.111642

[World.Inputs]

[World.Outputs]
temperature = "m.temperature"
pressure = "m.pressure"
density = "m.density"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
