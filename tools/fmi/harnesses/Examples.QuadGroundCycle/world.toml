# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 6000000000
step = 2000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]

[World.Outputs]
altitude = "m.altitude"
verticalvelocity = "m.verticalVelocity"
normalload = "m.normalLoad"
contactcount = "m.contactCount"
acceleration_frd_1 = "m.acceleration_frd[1]"
acceleration_frd_2 = "m.acceleration_frd[2]"
acceleration_frd_3 = "m.acceleration_frd[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
