# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 200000000
step = 10000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
speed = "m.speed"

[World.Outputs]
traptorque = "m.trapTorque"
sintorque = "m.sinTorque"
electricalangle = "m.electricalAngle"
trappowerresidual = "m.trapPowerResidual"
neutralliftcurrent = "m.neutralLiftCurrent"
trapneutralvoltage = "m.trapNeutralVoltage"
traphousingtorque = "m.trapHousingTorque"
sinhousingtorque = "m.sinHousingTorque"
sinpowerresidual = "m.sinPowerResidual"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
