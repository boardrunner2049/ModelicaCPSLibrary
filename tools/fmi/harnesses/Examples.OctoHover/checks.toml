# Acceptance checks over out/trace.csv (see tools/check_trace.py).
#
# OctoHover (OctoX: 8 arms, radius 0.35 m, first arm at 22.5 deg) with three
# tunable-parameter overrides (world.toml):
#   vehicle.aggregate.mass = 1.8 kg (default 1.5): the hover speed
#     sqrt(m g/(n kT)) = 469.7335681 rad/s, the motors' omega_start and the
#     ESC command all derive from it through calculated parameters;
#   geometry.spinSign = {1,1,-1,-1,1,1,-1,-1} (paired layout instead of the
#     default alternating one): it reaches both the blades' spinSign and the
#     vehicle's yaw reaction, and it still cancels in sum;
#   vehicle.omega_start = {0,0,-0.4}: an initial yaw rate.
# Thrust T = m g/8 = 2.20649625 N per rotor, drag torque Q = kQ omega_h^2 = 0.033097444
# N.m. All moments cancel and z is principal, so the yaw rate stays -0.4 rad/s,
# the vehicle stays level at its altitude and the heading is pi/2 + (-0.4) t.
# Each hub then moves on a circle: omega x r_i, |.| = 0.4 * 0.35 = 0.14 m/s.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.vehicle.chassis.mass"
at = "all"
near = 1.8
tol = 0.0
why = "the mass override reaches the rigid body"

