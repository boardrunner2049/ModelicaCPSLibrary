# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 2000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Perturbations of the closed test (the model's own asserts must still hold):
# a heavier body with a full, asymmetric inertia that starts tumbling. A
# ballistic CG path is independent of mass and rotation, so the asserts on
# p_w, v_w and specificForce_b now also test the body-frame velocity transport
# term (-omega x v_b) and the R_wb mapping under fast rotation.
[Models.m.Parameters]
"body.mass" = 7.3
"body.inertia" = [0.03, 0.004, -0.002, 0.004, 0.05, 0.006, -0.002, 0.006, 0.07]
"body.omega_start" = [2.0, -1.0, 3.0]

[World.Inputs]

[World.Outputs]

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
