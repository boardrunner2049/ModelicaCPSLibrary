# Acceptance checks over out/trace.csv (see tools/check_trace.py).
#
# QuadHover with two tunable-parameter overrides (world.toml):
#   rotors[1].kT = 1.25e-5 (others 1e-5): rotor 1 needs a lower hover speed
#     omega_1 = sqrt(m g/(4 kT_1)) = 542.4016040 rad/s for the same thrust m g/4, so
#     its drag torque kQ omega_1^2 = 0.044129925 N.m is smaller than the others'
#     0.055162406; the yaw reactions no longer cancel: Mz = Q_1 - Q = -0.011032481 N.m.
#   motors[2].omegaMax = 1250: ESC 2 must command omega_h/1250 for the same speed.
# Thrusts are still equal and z is a principal axis (I = diag(0.02,0.02,0.04)),
# so the vehicle stays level and spins up about body z with constant
# alpha = Mz/Izz = -0.275812031 rad/s^2: yaw rate a t, heading pi/2 + a t^2/2.
# Rotor i body moment = r_i x (0,0,-T) + (0,0,spinSign_i Q_i); rotorMoment_b is
# [n,3] row-major; R_wb is row-major. Default field B_w = {0,20,45} uT NED.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

# --- rotor speeds, ESC commands, blade loads -------------------------------

[[check]]
variable = "m.motors[1].omega"
at = "all"
near = 542.4016039799293
tol = 1e-06
why = "motor 1 starts at and holds its hover speed sqrt(m g/(n kT_1)) (no transient)"

