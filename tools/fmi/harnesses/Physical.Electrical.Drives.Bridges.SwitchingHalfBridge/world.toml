# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 20000000
step = 1000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
highgate = "m.highGate"
lowgate = "m.lowGate"
backemf = "m.backEMF"

[World.Outputs]
phasecurrent = "m.phaseCurrent"
phasevoltage = "m.phaseVoltage"
dccurrent = "m.dcCurrent"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
