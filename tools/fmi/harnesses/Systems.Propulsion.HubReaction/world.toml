# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 1000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
aerodynamicmoment_r_1 = "m.aerodynamicMoment_r[1]"
aerodynamicmoment_r_2 = "m.aerodynamicMoment_r[2]"
aerodynamicmoment_r_3 = "m.aerodynamicMoment_r[3]"
acceleration = "m.acceleration"

[World.Outputs]
momentpositive_r_1 = "m.momentPositive_r[1]"
momentpositive_r_2 = "m.momentPositive_r[2]"
momentpositive_r_3 = "m.momentPositive_r[3]"
momentnegative_r_1 = "m.momentNegative_r[1]"
momentnegative_r_2 = "m.momentNegative_r[2]"
momentnegative_r_3 = "m.momentNegative_r[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
