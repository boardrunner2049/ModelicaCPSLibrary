# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 500000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Perturbation of the closed test: the CW blade gets a 1.7x thrust
# coefficient (its thrust is not asserted in the model; its yaw torque is, so
# kQ stays). The two blades then share a speed but not a thrust, which shows
# the per-instance kT is honoured and the thrusts are not cross-wired.
[Models.m.Parameters]
"cw.kT" = 1.7e-3

[World.Inputs]

[World.Outputs]

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
