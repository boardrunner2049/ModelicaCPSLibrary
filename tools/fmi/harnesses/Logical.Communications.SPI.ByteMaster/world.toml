# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 36000
step = 50
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
requestid = "m.requestId"
txdata = "m.txData"
csactive = "m.csActive"
miso = "m.miso"

[World.Outputs]
cs_n = "m.cs_n"
sclk = "m.sclk"
mosi = "m.mosi"
busy = "m.busy"
completedid = "m.completedId"
rxdata = "m.rxData"
status = "m.status"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
