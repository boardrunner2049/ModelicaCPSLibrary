# Acceptance checks over out/trace.csv (see tools/check_trace.py).
#
# CoaxialHover (CoaxialX8: 4 QuadX arms, radius 0.25 m; rotors 1-4 upper at
# z = -0.025 m, 5-8 lower at z = +0.025 m on the same arms, spinSign
# {1,-1,1,-1,-1,1,-1,1} so each coaxial pair counter-rotates). Each rotor
# carries T = m g/8 = 1.8387469 N at omega_h = 428.8061188 rad/s, Q = 0.027581203 N.m.
# Override (world.toml): vehicle.omega_start = {0.2, 0, 0}, an initial roll
# rate. Moments cancel and x is principal, so the vehicle rolls at a constant
# p = 0.2 rad/s: roll phi = p t. Heading East: body x = East, a positive roll
# tips the thrust toward body +y = South, so with thrust m g along -body z
#   a_N = -g sin(p t),  a_D = g (1 - cos(p t)),  a_E = 0
#   v_N = -g (1 - cos(p t))/p,     v_D = g (t - sin(p t)/p)
#   p_N = -g (t - sin(p t)/p)/p,   p_D = -1 + g (t^2/2 - (1 - cos(p t))/p^2)
# The roll rate makes the hub velocity omega x r depend on the rotor height:
# upper and lower rotors on one arm differ by omega x (0,0,-0.05) = (0, 0.05 p, 0)
# in body axes, -0.05 p on rotor y, which is the only place the +-0.025 m
# coaxial offsets are observable (the thrust is along z).

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

