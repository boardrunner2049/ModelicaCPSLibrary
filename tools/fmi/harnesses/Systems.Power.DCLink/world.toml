# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 3000000
step = 1000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
sourcevoltage = "m.sourceVoltage"
loadcurrent = "m.loadCurrent"

[World.Outputs]
voltage = "m.voltage"
sourcecurrent = "m.sourceCurrent"
sourcepower = "m.sourcePower"
storedenergy = "m.storedEnergy"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
