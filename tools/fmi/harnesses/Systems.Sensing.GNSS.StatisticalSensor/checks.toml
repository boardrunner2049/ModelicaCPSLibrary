# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Systems.Sensing.GNSS.StatisticalSensor (G1), antenna on a 20 m circle climbing 1 m/s; 0.2 s epochs.
# Contract: at epoch k the receiver acquires truth(t_k) + bias + biasFactor*latentBias_k +
# noiseFactor*n_k (n_k = normal[7:12], drawn at t_k), reports covariance NF NF' + BF BF', and the
# delivery queue (latency 0) hands it out at t_k with sampleTime = t_k.
# The first epoch (t = 0) acquires the inputs' start values (zero), so value checks start at 0.2 s.
# Each later epoch acquires the inputs held over the 10 ms communication step before it, so
# "truth" below is the closed form at sampleTime - 0.01 s (10 m/s * 10 ms = 0.1 m otherwise).
# Per epoch the error minus bias has std sqrt(NF NF' + BF BF') on the diagonal (sqrt 1.25 = 1.12 m
# North): bounded by 5 sigma. Its white part (minus biasState) has mean square diag(NF NF') -- within
# 50 % over the 39..50 epochs of a window -- and North-East correlation NF[2,1] NF[1,1] = 0.15 m2.
# (The 60 s bias is one draw over 20 s, so the full error's mean square is not checked against
# the covariance.)
# Fix outage: fixAvailable false on [10, 12) s -> epochs 10.2 .. 12.0 s invalid.


[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
expr = "{m.sampleTime} - 0.2*({m.sequence} - 1)"
at = "all"
near = 0.0
tol = 1e-09
why = "epochs on the 0.2 s grid from 0: sampleTime = (sequence - 1) * 0.2, no drift"

[[check]]
expr = "{m.deliveryTime} - {m.sampleTime}"
at = "all"
near = 0.0
tol = 1e-12
why = "latency 0: delivered at the acquisition epoch"

[[check]]
expr = "t - {m.deliveryTime}"
at = "all"
range = [-1e-09, 0.2]
why = "PVT is fresh: less than one period old at every communication point"

[[check]]
variable = "m.sequence"
at = "end"
near = 101.0
tol = 0.0
why = "101 epochs in 20 s (t = 0 included), the outage epochs counted too"

[[check]]
expr = "{m.sequence@15} - {m.sequence@5}"
at = "end"
near = 50.0
tol = 0.0
why = "update rate 5 Hz: 50 epochs between 5 and 15 s"

[[check]]
expr = "{m.valid} + {m.fixType}"
at = "all"
from = 0.2
to = 10.199
near = 4.0
tol = 0.0
why = "valid 3D fix on [0.2, 10.199]"

[[check]]
expr = "{m.valid} + {m.fixType}"
at = "all"
from = 12.2
to = 20.0
near = 4.0
tol = 0.0
why = "valid 3D fix on [12.2, 20.0]"

[[check]]
expr = "{m.valid} + {m.fixType}"
at = "all"
from = 10.2
to = 12.199
near = 0.0
tol = 0.0
why = "fix outage: epochs 10.2 .. 12.0 s delivered invalid with fixType 0"

[[check]]
expr = "abs({m.position[1]}) + abs({m.position[2]}) + abs({m.position[3]}) + abs({m.velocity[1]}) + abs({m.velocity[2]}) + abs({m.velocity[3]})"
at = "all"
from = 10.2
to = 12.199
near = 0.0
tol = 0.0
why = "fix outage: payload is zero, not a stale fix"

