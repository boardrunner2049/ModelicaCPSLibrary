[[check]]
expr = "abs({m.biasState[1]}) + abs({m.biasState[2]}) + abs({m.biasState[3]})/2"
at = "all"
range = [0.0, 12.0]
why = "biasState is biasFactor * latentBias, bounded by 4 sigma"

[[check]]
expr = "{m.position[1]} - (20*cos(0.5*({m.sampleTime} - 0.01))) - 1.0 - {m.biasState[1]} - (0.5*{m.normal[7]})"
at = "all"
from = 0.2
to = 10.199
near = 0.0
tol = 1e-09
known = "Rumoca 6058a2bb orders the two when-clauses on the same sample() wrongly: SampledDelivery stores the acquisition before StatisticalSensor's when-clause draws the epoch's normals, so every delivered error is the previous epoch's (zero at the first epoch); see README, Status"
why = "North: exact G1 law at each epoch: error - bias = biasState + noiseFactor*normal[7:12] of that epoch"

