# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 140000000
step = 10000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
modulation = "m.modulation"

[World.Outputs]
legcurrent = "m.legCurrent"
loadcurrent = "m.loadCurrent"
phasevoltage = "m.phaseVoltage"
buspower = "m.busPower"
bridgeloss = "m.bridgeLoss"
dcnegvoltage = "m.dcNegVoltage"
idlecurrent = "m.idleCurrent"
idleforwardbias = "m.idleForwardBias"
kclresidual = "m.kclResidual"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
