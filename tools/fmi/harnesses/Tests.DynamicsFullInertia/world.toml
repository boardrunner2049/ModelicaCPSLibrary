# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 1000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Perturbations of the closed test (its asserts constrain only omega_b and
# alpha_b): a start position and a body-frame start velocity, so the rotating
# body also translates and the CG path tests v_w = R_wb v_b under rotation.
[Models.m.Parameters]
"body.mass" = 3.0
"body.p_start" = [1.0, -2.0, 3.0]
"body.v_start" = [0.4, -0.3, 0.2]

[World.Inputs]

[World.Outputs]

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
