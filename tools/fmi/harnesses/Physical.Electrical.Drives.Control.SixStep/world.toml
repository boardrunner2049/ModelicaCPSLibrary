# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 900000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
command = "m.command"
electricalangle = "m.electricalAngle"
phasecurrent_1 = "m.phaseCurrent[1]"
phasecurrent_2 = "m.phaseCurrent[2]"
phasecurrent_3 = "m.phaseCurrent[3]"

[World.Outputs]
modulation = "m.modulation"
highselected_1 = "m.highSelected[1]"
highselected_2 = "m.highSelected[2]"
highselected_3 = "m.highSelected[3]"
lowselected_1 = "m.lowSelected[1]"
lowselected_2 = "m.lowSelected[2]"
lowselected_3 = "m.lowSelected[3]"
coast = "m.coast"
recirculating = "m.recirculating"
sector = "m.sector"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
