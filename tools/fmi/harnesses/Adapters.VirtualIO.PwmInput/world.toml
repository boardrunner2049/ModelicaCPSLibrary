# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 3000000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[Models.m.Parameters]
pwmMin = [1000.0, 1000.0, 1100.0, 1050.0]
pwmMax = [2000.0, 2000.0, 1900.0, 2050.0]

[World.Inputs]
pulsewidth_us_1 = "m.pulseWidth_us[1]"
pulsewidth_us_2 = "m.pulseWidth_us[2]"
pulsewidth_us_3 = "m.pulseWidth_us[3]"
pulsewidth_us_4 = "m.pulseWidth_us[4]"

[World.Outputs]
normalizedcommand_1 = "m.normalizedCommand[1]"
normalizedcommand_2 = "m.normalizedCommand[2]"
normalizedcommand_3 = "m.normalizedCommand[3]"
normalizedcommand_4 = "m.normalizedCommand[4]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
