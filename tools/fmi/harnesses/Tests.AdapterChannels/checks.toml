# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# PWM: clamp((pw - 1000)/1000, 0, 1) for pw = {900,1100,...,1600,2100} us ->
# {0, .1, .2, .3, .4, .5, .6, 1}; every one of the eight channels is checked,
# so a trimmed, truncated or shifted channel array would show. Sensor mounts
# (OctoX geometry):
# R_bImu = [0 -1 0; 1 0 0; 0 0 1] (sensor x along body right, a +90 deg yaw):
#   accel {1,2,3} -> FRD {-2, 1, 3}, gyro {4,5,6} -> {-5, 4, 6}; a transposed
#   matrix would give {2,-1,3} instead.
# R_bMag = diag{1,-1,-1}: field {1,2,3}e-5 T -> {1,-2,-3}e-5 T.
# GNSS values are already NED: position {t,2t,-3t}, velocity {1,2,-3} pass
# through unchanged. Native `rumoca sim` agrees exactly. The inputs are
# constants or functions of time inside the model, so the t = 0 row already
# holds them and "all" covers the whole run.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.commands.normalizedCommand[1]"
at = "all"
near = 0
tol = 1e-12
why = "900 us is below pwmMin: clipped to 0, not -0.1"

[[check]]
variable = "m.commands.normalizedCommand[2]"
at = "all"
near = 0.1
tol = 1e-12
why = "1100 us -> 0.1 on channel 2"

[[check]]
variable = "m.commands.normalizedCommand[3]"
at = "all"
near = 0.2
tol = 1e-12
why = "1200 us -> 0.2 on channel 3"

[[check]]
variable = "m.commands.normalizedCommand[4]"
at = "all"
near = 0.3
tol = 1e-12
why = "1300 us -> 0.3 on channel 4"

[[check]]
variable = "m.commands.normalizedCommand[5]"
at = "all"
near = 0.4
tol = 1e-12
why = "1400 us -> 0.4 on channel 5"

[[check]]
