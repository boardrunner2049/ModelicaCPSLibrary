# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh.
[World]
start = 0
stop = 13000000000
step = 10000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

# Tunable-parameter overrides (kept by new_harness.py --refresh): fixed NED biases.
[Models.m.Parameters]
positionBias = [1.0, -0.5, 0.3]
velocityBias = [0.05, -0.02, 0.10]

[World.Inputs]
position_w_1 = "m.position_w[1]"
position_w_2 = "m.position_w[2]"
position_w_3 = "m.position_w[3]"
velocity_w_1 = "m.velocity_w[1]"
velocity_w_2 = "m.velocity_w[2]"
velocity_w_3 = "m.velocity_w[3]"

[World.Outputs]
position_1 = "m.position[1]"
position_2 = "m.position[2]"
position_3 = "m.position[3]"
velocity_1 = "m.velocity[1]"
velocity_2 = "m.velocity[2]"
velocity_3 = "m.velocity[3]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
