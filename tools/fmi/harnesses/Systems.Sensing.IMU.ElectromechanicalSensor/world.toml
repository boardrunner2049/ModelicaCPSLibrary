# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 3000000000
step = 250000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
sensortemperature = "m.sensorTemperature"
r_wb_1 = "m.R_wb[1]"
r_wb_2 = "m.R_wb[2]"
r_wb_3 = "m.R_wb[3]"
r_wb_4 = "m.R_wb[4]"
r_wb_5 = "m.R_wb[5]"
r_wb_6 = "m.R_wb[6]"
r_wb_7 = "m.R_wb[7]"
r_wb_8 = "m.R_wb[8]"
r_wb_9 = "m.R_wb[9]"
a_w_1 = "m.a_w[1]"
a_w_2 = "m.a_w[2]"
a_w_3 = "m.a_w[3]"
gravity_w_1 = "m.gravity_w[1]"
gravity_w_2 = "m.gravity_w[2]"
gravity_w_3 = "m.gravity_w[3]"
omega_b_1 = "m.omega_b[1]"
omega_b_2 = "m.omega_b[2]"
omega_b_3 = "m.omega_b[3]"
alpha_b_1 = "m.alpha_b[1]"
alpha_b_2 = "m.alpha_b[2]"
alpha_b_3 = "m.alpha_b[3]"
gyrodriveforce_1 = "m.gyroDriveForce[1]"
gyrodriveforce_2 = "m.gyroDriveForce[2]"
gyrodriveforce_3 = "m.gyroDriveForce[3]"
gyrosenseforce_1 = "m.gyroSenseForce[1]"
gyrosenseforce_2 = "m.gyroSenseForce[2]"
gyrosenseforce_3 = "m.gyroSenseForce[3]"
accelforce_1 = "m.accelForce[1]"
accelforce_2 = "m.accelForce[2]"
accelforce_3 = "m.accelForce[3]"

[World.Outputs]
sampletime = "m.sampleTime"
deliverytime = "m.deliveryTime"
sequence = "m.sequence"
valid = "m.valid"
acceleration_1 = "m.acceleration[1]"
acceleration_2 = "m.acceleration[2]"
acceleration_3 = "m.acceleration[3]"
gyro_1 = "m.gyro[1]"
gyro_2 = "m.gyro[2]"
gyro_3 = "m.gyro[3]"
gyrolocked_1 = "m.gyroLocked[1]"
gyrolocked_2 = "m.gyroLocked[2]"
gyrolocked_3 = "m.gyroLocked[3]"
biasstate_1 = "m.biasState[1]"
biasstate_2 = "m.biasState[2]"
biasstate_3 = "m.biasState[3]"
biasstate_4 = "m.biasState[4]"
biasstate_5 = "m.biasState[5]"
biasstate_6 = "m.biasState[6]"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
