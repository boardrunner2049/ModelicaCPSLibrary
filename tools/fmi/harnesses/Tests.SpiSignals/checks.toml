# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Generated per pair; 1 MHz clock (half period 0.5 us), byte k submitted at
# t0 = 2 + 12(k-1) us and retiring at t0 + 8 us. Sampling edges: CPHA = 0 ->
# edges 1,3,..,15 (t0 + 0.5 + i us), CPHA = 1 -> edges 2,4,..,16 (t0 + 1 + i).
# Line bits are read 0.1 us before each sampling edge (setup time), weighted
# 128..1 for MSB first and 1..128 for LSB first; 53 = 00110101 is not a
# palindrome, so a wrong bit order or mode shows. These restate the model's
# asserts (11, 23, 35, 47, 59, 66 us) at the exact retirement instants and add
# line-level timing. The whole trace also matches a native `bin/rumoca sim`
# of the test exactly at every 50 ns sample (234 columns).

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.master[[]?].cs_n"
at = "all"
from = 1e-6
to = 64.95e-6
range = [0, 0]
why = "CS held asserted continuously across all five bytes"

# --- pair 1 (CPOL=0, CPHA=0, MSB first) ---

[[check]]
variable = "m.master[1].sclk"
at = "all"
to = 2.45e-06
range = [0, 0]
why = "pair 1 (CPOL=0, CPHA=0, MSB first): SCLK idles at CPOL before the first byte"

[[check]]
variable = "m.master[1].sclk"
at = "all"
from = 5.8e-05
range = [0, 0]
why = "pair 1 (CPOL=0, CPHA=0, MSB first): SCLK back at idle polarity after the last byte and CS release"

[[check]]
expr = "128*{m.master[1].mosi@2.4e-6} + 64*{m.master[1].mosi@3.4e-6} + 32*{m.master[1].mosi@4.4e-6} + 16*{m.master[1].mosi@5.4e-6} + 8*{m.master[1].mosi@6.4e-6} + 4*{m.master[1].mosi@7.4e-6} + 2*{m.master[1].mosi@8.4e-6} + 1*{m.master[1].mosi@9.4e-6}"
near = 150
tol = 0
why = "pair 1 (CPOL=0, CPHA=0, MSB first): MOSI just before the 8 sampling edges spells byte 1 = 150 in the configured bit order"

[[check]]
expr = "128*{m.slave[1].miso@2.4e-6} + 64*{m.slave[1].miso@3.4e-6} + 32*{m.slave[1].miso@4.4e-6} + 16*{m.slave[1].miso@5.4e-6} + 8*{m.slave[1].miso@6.4e-6} + 4*{m.slave[1].miso@7.4e-6} + 2*{m.slave[1].miso@8.4e-6} + 1*{m.slave[1].miso@9.4e-6}"
near = 105
tol = 0
why = "pair 1 (CPOL=0, CPHA=0, MSB first): slave MISO before the sampling edges spells 105 in the configured bit order"

[[check]]
variable = "m.master[1].sclk"
at = "mean"
from = 2e-06
to = 9.95e-06
near = 0.5
tol = 1e-09
why = "pair 1 (CPOL=0, CPHA=0, MSB first): 8 SCLK periods at 1 MHz, 50% duty, in the 8 us byte"

[[check]]
variable = "m.master[1].busy"
at = "all"
from = 2e-06
to = 9.95e-06
range = [1, 1]
why = "pair 1 (CPOL=0, CPHA=0, MSB first): byte 1 busy for exactly 16 half periods from 2 us"

[[check]]
expr = "{m.master[1].completedId@10e-6}*10000 + {m.master[1].rxData@10e-6}*10 + {m.master[1].status@10e-6} + 100000*{m.master[1].busy@10e-6}"
near = 11051
tol = 0
why = "pair 1 (CPOL=0, CPHA=0, MSB first): at 10 us request 1 retired, not busy, status 1, master received 105"

[[check]]
expr = "{m.slave[1].rxData@10e-6}*10 + {m.slave[1].receivedCount@10e-6}"
near = 1501
tol = 0
why = "pair 1 (CPOL=0, CPHA=0, MSB first): slave holds byte 1 = 150, receivedCount 1"

[[check]]
variable = "m.slave[1].receivedCount"
at = "9.45e-6"
near = 0
tol = 0
why = "pair 1 (CPOL=0, CPHA=0, MSB first): byte 1 not delivered before its last sampling edge (15th edge)"

[[check]]
variable = "m.master[1].busy"
at = "all"
from = 1.4e-05
to = 2.1949999999999998e-05
range = [1, 1]
