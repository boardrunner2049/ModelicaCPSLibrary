# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# Sensor law: f_b = R_wb'(a_w - g_w) + alpha x r + omega x (omega x r);
# acceleration = R_bs' f_b + accelBias, gyro = R_bs' omega + gyroBias.
# freefall: a_w = g -> 0. supported: a_w = 0, g = {0,0,9.81} (NED) -> -g on z.
# lever: r = {1,0,0}, alpha = {0,0,3} -> alpha x r = {0,3,0};
#   omega = {1,2,3} -> omega x (omega x r) = {-13,2,3}; f_b = {-13,5,-6.81};
#   R_bs' = [0 1 0; -1 0 0; 0 0 1] -> {5,13,-6.81} + bias = {5.1,13.2,-6.51};
#   gyro = R_bs'{1,2,3} + bias = {2,-1,3} + bias = {2.1,-0.8,3.3}.
# All inputs are constant equations of the model, so "all" covers every row,
# including t = 0. Native `bin/rumoca sim` agrees to the last bit.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.freefall.acceleration[1]"
at = "all"
near = 0.0
tol = 1e-10
why = "CG accelerometer reads zero specific force in freefall"

[[check]]
variable = "m.freefall.acceleration[2]"
at = "all"
near = 0.0
tol = 1e-10
why = "CG accelerometer reads zero specific force in freefall"

[[check]]
variable = "m.freefall.acceleration[3]"
at = "all"
near = 0.0
tol = 1e-10
why = "CG accelerometer reads zero specific force in freefall"

[[check]]
variable = "m.supported.acceleration[1]"
at = "all"
near = 0.0
tol = 1e-10
why = "supported FRD accelerometer reads -g on z (specific force points up)"

[[check]]
variable = "m.supported.acceleration[2]"
at = "all"
near = 0.0
tol = 1e-10
why = "supported FRD accelerometer reads -g on z (specific force points up)"

[[check]]
variable = "m.supported.acceleration[3]"
at = "all"
near = -9.81
tol = 1e-10
why = "supported FRD accelerometer reads -g on z (specific force points up)"

[[check]]
variable = "m.supported.gyro[1]"
at = "all"
near = 0.0
tol = 1e-10
why = "no rotation, no bias: gyro reads zero"

[[check]]
variable = "m.supported.gyro[2]"
at = "all"
near = 0.0
tol = 1e-10
why = "no rotation, no bias: gyro reads zero"

[[check]]
variable = "m.supported.gyro[3]"
at = "all"
near = 0.0
tol = 1e-10
why = "no rotation, no bias: gyro reads zero"

[[check]]
variable = "m.lever.acceleration[1]"
at = "all"
near = 5.1
tol = 1e-10
why = "lever arm tangential + centripetal acceleration, mount rotation (not transposed) and bias"

[[check]]
variable = "m.lever.acceleration[2]"
at = "all"
near = 13.2
tol = 1e-10
why = "lever arm tangential + centripetal acceleration, mount rotation (not transposed) and bias"

[[check]]
variable = "m.lever.acceleration[3]"
at = "all"
near = -6.51
tol = 1e-10
why = "lever arm tangential + centripetal acceleration, mount rotation (not transposed) and bias"

[[check]]
variable = "m.lever.gyro[1]"
at = "all"
near = 2.1
tol = 1e-10
why = "gyro: mount rotation of omega plus bias; independent of the lever arm"

[[check]]
variable = "m.lever.gyro[2]"
at = "all"
near = -0.8
tol = 1e-10
why = "gyro: mount rotation of omega plus bias; independent of the lever arm"

[[check]]
variable = "m.lever.gyro[3]"
at = "all"
near = 3.3
tol = 1e-10
why = "gyro: mount rotation of omega plus bias; independent of the lever arm"

[[check]]
variable = "m.lever.specificForce_b[1]"
at = "all"
near = -13.0
tol = 1e-10
why = "body-frame specific force before the mount rotation"

[[check]]
variable = "m.lever.specificForce_b[2]"
at = "all"
near = 5.0
tol = 1e-10
why = "body-frame specific force before the mount rotation"

[[check]]
variable = "m.lever.specificForce_b[3]"
at = "all"
near = -6.81
tol = 1e-10
why = "body-frame specific force before the mount rotation"

[[check]]
expr = "norm({m.lever.acceleration[1]} - 0.1, {m.lever.acceleration[2]} - 0.2, {m.lever.acceleration[3]} - 0.3) - norm({m.lever.specificForce_b[1]}, {m.lever.specificForce_b[2]}, {m.lever.specificForce_b[3]})"
at = "all"
near = 0
tol = 1e-12
why = "the sensor mount is a rotation: unbiased reading has the same magnitude as the body specific force"

[[check]]
expr = "{m.lever.specificForce_b[1]} - {m.supported.specificForce_b[1]}"
at = "all"
near = -13
tol = 1e-12
why = "lever minus CG specific force (same attitude/gravity) is the pure rigid-body term: omega x (omega x r) + alpha x r has x component -(omega_y^2 + omega_z^2) = -13"
