# --- asymmetric EMF e = {1.5, -1.0, 0.5} V, d = 0.5: the same phase pair in both orders ---
# I = (7.75 - (e_high - e_low))/0.41; star = v_high - R*I - e_high = 3.625 V in both;
# floating phase 3 sits at star + e3 = 4.125 V, inside the rails (its diodes stay off).

[[check]]
variable = "m.phaseCurrent[2]"
at = "0.057"
near = 25.0
tol = 3e-3
why = "sector 5 (high 2, low 1): e2 - e1 = -2.5 V aids the drive, I = (7.75 + 2.5)/0.41 = 25.0 A out of phase 2 (native 24.99904)"

[[check]]
variable = "m.phaseCurrent[1]"
at = "0.057"
near = -25.0
tol = 3e-3
why = "sector 5: the current returns through phase 1's low switch"

[[check]]
variable = "m.phaseCurrent[3]"
at = "0.057"
near = 0.0
tol = 1e-3
why = "sector 5: phase 3 floats (only leakage)"

[[check]]
variable = "m.dcCurrent"
at = "0.057"
near = 12.5
tol = 3e-3
why = "Idc = d*I = 0.5*25.0"

[[check]]
variable = "m.lossPower"
at = "0.057"
near = 12.5055
tol = 0.01
why = "ESC loss (d*Ron + (1-d)*Rd + Ron)*I^2 + (1-d)*Vd*I = 6.25 + 6.25 W (+ ~6 mW leakage; native 12.5055)"

[[check]]
variable = "m.starVoltage"
at = "0.057"
near = 3.625
tol = 2e-3
why = "star = v2 - R*I - e2 = (7.75 - 0.005*25 = 7.625) - 5.0 + 1.0 = 3.625 V"

[[check]]
variable = "m.phaseCurrent[1]"
at = "end"
near = 12.8049
tol = 3e-3
why = "sector 2 (high 1, low 2), same phase pair reversed: e1 - e2 = +2.5 V now opposes the drive, I = (7.75 - 2.5)/0.41 = 12.8049 A (native 12.80407). A swapped high/low table entry or a transposed EMF would exchange the 25.0 and 12.8 A values"

[[check]]
variable = "m.phaseCurrent[2]"
at = "end"
near = -12.8049
tol = 3e-3
why = "sector 2: the current returns through phase 2's low switch"

[[check]]
variable = "m.phaseCurrent[3]"
at = "end"
near = 0.0
tol = 1e-3
why = "sector 2: phase 3 floats"

[[check]]
variable = "m.dcCurrent"
at = "end"
near = 6.4024
tol = 3e-3
why = "Idc = d*I = 0.5*12.8049"

[[check]]
variable = "m.lossPower"
at = "end"
near = 4.8467
tol = 0.01
why = "ESC loss 0.01*12.805^2 + 0.25*12.805 = 1.6397 + 3.2012 W (+ leakage; native 4.84667)"

[[check]]
variable = "m.starVoltage"
at = "end"
near = 3.625
tol = 2e-3
why = "star = v1 - R*I - e1 = 7.686 - 2.561 - 1.5 = 3.625 V"
