# Acceptance checks over out/trace.csv (see tools/check_trace.py).
# ESC: Ron = Rdiode = 5 mOhm, Vdiode = 0.5 V, Goff = 1e-5 S; ideal 16 V bus.
# Load: floating star, per phase R = 0.2 Ohm, L = 0.1 mH, EMF e_j.
# Six-step tables: sector s -> (high, low) phase = 1:(3,2) 2:(1,2) 3:(1,3)
# 4:(2,3) 5:(2,1) 6:(3,1); sector = 1 + floor(mod(theta + pi/6, 2 pi)/(pi/3)).
# Closed forms (each segment lasts >= 10 time constants 2L/0.41 = 0.49 ms):
#   d = 0.5: I = (d*16 - (1-d)*0.5)/(d*Ron + (1-d)*Rd + 2R + Ron) = 7.75/0.41
#            = 18.9024 A out of the high phase and back through the low phase;
#   d = 1:   I = 16/0.41 = 39.0244 A;
#   cutoff from 39.02 A: the held low switch and the old high phase's low
#            diode recirculate, 2L di/dt = -(Vd + 0.41 i), so
#            i(t) = (I0 + Vd/0.41) exp(-t/0.488 ms) - Vd/0.41, zero after 1.7056 ms;
#   Hi-Z with e = {0, 12, -9}: diodes rectify e2 - e3 = 21 V > 16 + 2*0.5:
#            I = 4/0.41 = 9.7561 A returned to the bus.
# All values were confirmed with a native 'rumoca sim' of the same wrapper and
# scenario (inputs as time functions, --rtol 1e-9) resampled on the 10 us grid.
#   initial i0 = 5 A at zero command (Hi-Z): diodes return it to the bus,
#            2L di/dt = -17 - 0.41 i, extinct after 55.5 us;
#   asymmetric EMF {1.5, -1.0, 0.5}: sector 5 -> 25.0 A, sector 2 -> 12.8049 A.
# Leakage through Goff adds up to ~1e-4 A and ~0.01 W; the tolerances allow it.

[[check]]
variable = "m.*"
at = "all"
finite = true
why = "every recorded value stays finite"

[[check]]
variable = "m.coast"
at = "0.002"
near = 1
tol = 0
why = "zero command at start: Hi-Z coast (no gate selected)"

[[check]]
variable = "m.coast"
at = "0"
near = 1
tol = 0
why = "documented SixStep behaviour: zero-command operation starts in Hi-Z even with a nonzero initial winding current (i0 = 5 A), no latched recirculation"

[[check]]
variable = "m.recirculating"
at = "0"
near = 0
tol = 0
why = "the initial() branch clears the recirculation latch regardless of the 5 A winding current"

[[check]]
variable = "m.dcCurrent"
at = "0"
near = -5.0
tol = 2e-3
why = "with every switch off the 5 A winding current can only flow through the body diodes: low diode dc_n -> phase 1, phase 2 -> high diode -> dc_p, so it returns to the bus (native -4.9994: leakage). A latched low switch would keep it off the bus"

[[check]]
variable = "m.phaseCurrent[1]"
at = "0.00001"
near = 4.0574
tol = 2e-3
why = "the diodes drive the current down against the bus: 2L di/dt = -(16 + 2*Vd) - (2R + 2Rd) i, i = -41.463 + 46.463*exp(-t/0.4878 ms) = 4.0574 A at 10 us (native 4.05724). Low-side recirculation (only 2*Vd opposing) would leave ~4.95 A"

[[check]]
variable = "m.starVoltage"
at = "0.00001"
near = 8.0
tol = 1e-3
why = "phases clamped at -Vd - Rd*i and 16 + Vd + Rd*i by the conducting diodes; the symmetric R-L-(e=0) branches put the star at their midpoint 8 V"

[[check]]
variable = "m.phaseCurrent*"
at = "0.0001"
near = 0.0
tol = 1e-4
why = "the initial current is extinguished after tau*ln(46.463/41.463) = 55.5 us and the diodes then block (native: 0 from 60 us)"

[[check]]
variable = "m.starVoltage"
at = "0.0019"
near = 5.3333
tol = 0.001
why = "Hi-Z with no current: each phase is a Goff divider, one Goff (high diode) to dc_p and two (low switch, low diode) to dc_n, so star = 16/3 V. A closed low switch would pin it near 0"

[[check]]
variable = "m.phaseCurrent*"
