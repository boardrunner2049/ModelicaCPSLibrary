# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 1200000000
step = 1000000
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
active = "m.active"
gap = "m.gap"
normalvelocity = "m.normalVelocity"

[World.Outputs]
penetration = "m.penetration"
normalforce = "m.normalForce"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
