# Generated by tools/new_harness.py from out/model.fmu; refresh with --refresh
# (keeps [World] stop/step and [Models.m.Parameters]).
[World]
start = 0
stop = 38000
step = 50
time_unit = "ns"

[Models.m]
path = "out/model.fmu"

[World.Inputs]
cs_n = "m.cs_n"
sclk = "m.sclk"
mosi = "m.mosi"
txdata = "m.txData"

[World.Outputs]
miso = "m.miso"
misoenabled = "m.misoEnabled"
rxdata = "m.rxData"
receivedcount = "m.receivedCount"

[Trace]
every_step = true
models = ["m"]
output = "out/trace.csv"

[Logging]
output = "out/runtime.log"

[Frontend]
enabled = false
