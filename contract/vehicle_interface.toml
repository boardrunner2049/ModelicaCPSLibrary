# CP Models vehicle interface: normative machine-readable contract.
#
# This table is authoritative. docs/vehicle-interface.md explains it, the
# checker (tools/vehicle_interface) enforces it on exported FMU metadata, and
# the runtime (runtime/) consumes only descriptors the checker produced.
#
# Field keys:
#   name        exported FMI variable name
#   type        FMI 3 type element (Float64, Int32, ...)
#   causality   allowed FMI causality, or a list of allowed causalities
#   variability allowed FMI variability, or a list (absent: not checked)
#   shape       [] scalar; [3] fixed; ["n"] one dimension of any size >= 1
#   required    required for the capability to be provided
#   start       "finite": every element needs a finite literal start value
#   unit        documented unit; checked only when the FMU declares one
#   frame       documented frame or datum
#   meaning     documented semantics (not machine-checked)

[contract]
name = "cp_vehicle_interface"
version = 1
# The descriptor schema is versioned independently of the contract.
descriptor_schema = 1
fmi_version = "3."
reference_point = "combined_cg"

# Every conforming FMU declares this marker. Rumoca exports a Modelica
# `constant Integer` as causality="local" variability="constant" with its
# value as start; a `final parameter` exports without a start value, so the
# value could not be checked from metadata. The runtime re-reads the value
# from the instance after initialization.
[marker]
name = "cp_vehicle_interface_version"
type = "Int32"
causality = ["local", "output"]
variability = "constant"
value = 1

[capabilities.pwm_actuation_v1]
summary = "Pulse-width commands, one element per mapped host output channel."
[[capabilities.pwm_actuation_v1.fields]]
name = "pwm"
type = "Float64"
causality = "input"
shape = ["n"]
required = true
start = "finite"
unit = "us"
meaning = "Element k+1 is mapped host output channel k. n is the exported dimension, not the rotor count; unused channels are valid and keep their start value."
[[capabilities.pwm_actuation_v1.fields]]
name = "pwm_min"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "us"
meaning = "Pulse width of normalized command 0: zero thrust on a one-sided channel (motor, throttle), full negative on a centred one (steering, control surface, reversible drive), whose neutral is the midpoint of pwm_min..pwm_max."
[[capabilities.pwm_actuation_v1.fields]]
name = "pwm_max"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "us"
meaning = "Pulse width of normalized command 1: full thrust, or full positive on a centred channel."

[capabilities.kinematic_state_v1]
summary = "Physical truth of the vehicle at the combined CG; never a simulated measurement."
[[capabilities.kinematic_state_v1.fields]]
name = "state.position_ned"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m"
frame = "local NED at the geodetic origin"
meaning = "CG position relative to the origin (lat0, lon0, ground_alt_wgs84); down is zero at ground_alt_wgs84."
[[capabilities.kinematic_state_v1.fields]]
name = "state.velocity_ned"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m/s"
frame = "local NED"
meaning = "CG velocity."
[[capabilities.kinematic_state_v1.fields]]
name = "state.quaternion_wb"
type = "Float64"
causality = "output"
shape = [4]
required = true
unit = "1"
frame = "body FRD to local NED"
meaning = "Scalar-first (w,x,y,z) Hamilton quaternion q with v_ned = q * v_frd * conj(q). Unit norm up to integration error; q and -q are the same attitude."
[[capabilities.kinematic_state_v1.fields]]
name = "state.angular_velocity_frd"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "rad/s"
frame = "body FRD"
meaning = "Body angular velocity relative to NED, resolved in body FRD."
[[capabilities.kinematic_state_v1.fields]]
name = "lat0"
type = "Float64"
causality = "parameter"
shape = []
required = true
unit = "deg"
frame = "WGS84"
meaning = "Geodetic origin latitude."
[[capabilities.kinematic_state_v1.fields]]
name = "lon0"
type = "Float64"
causality = "parameter"
shape = []
required = true
unit = "deg"
frame = "WGS84"
meaning = "Geodetic origin longitude."
[[capabilities.kinematic_state_v1.fields]]
name = "ground_alt_wgs84"
type = "Float64"
causality = "parameter"
shape = []
required = true
unit = "m"
frame = "WGS84 ellipsoid"
meaning = "Origin altitude above the ellipsoid; NED down is zero here."

[capabilities.imu_v1]
summary = "Latest IMU reading at the current communication point."
[[capabilities.imu_v1.fields]]
name = "accel"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m/s2"
frame = "body FRD"
meaning = "Specific force (acceleration minus gravity); about (0, 0, -9.81) at rest and level."
[[capabilities.imu_v1.fields]]
name = "gyro"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "rad/s"
frame = "body FRD"
meaning = "Angular rate."

[capabilities.magnetometer_v1]
summary = "Latest magnetometer reading."
[[capabilities.magnetometer_v1.fields]]
name = "mag"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "G"
frame = "body FRD"
meaning = "Magnetic field in Gauss (1 G = 1e-4 T)."
[[capabilities.magnetometer_v1.fields]]
name = "earth_field_north_T"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "T"
frame = "NED"
meaning = "Earth magnetic field at the origin, north component; a host sets it for its location so the model's magnetometer agrees with the host's field model."
[[capabilities.magnetometer_v1.fields]]
name = "earth_field_east_T"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "T"
frame = "NED"
meaning = "Earth magnetic field at the origin, east component; a host sets it for its location so the model's magnetometer agrees with the host's field model."
[[capabilities.magnetometer_v1.fields]]
name = "earth_field_down_T"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "T"
frame = "NED"
meaning = "Earth magnetic field at the origin, down component; a host sets it for its location so the model's magnetometer agrees with the host's field model."

[capabilities.gnss_v1]
summary = "Latest GNSS fix."
[[capabilities.gnss_v1.fields]]
name = "gps"
type = "Float64"
causality = "output"
shape = [3]
required = true
frame = "WGS84"
meaning = "Mixed units: latitude [deg], longitude [deg], altitude above the WGS84 ellipsoid [m]. One FMI unit cannot describe it."
[[capabilities.gnss_v1.fields]]
name = "vel_ned"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m/s"
frame = "local NED"
meaning = "Velocity."
[[capabilities.gnss_v1.fields]]
name = "yaw_deg"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "deg"
frame = "clockwise from true north"
meaning = "Heading. In current CP Models exports it is derived from attitude truth, not a GNSS measurement."
[[capabilities.gnss_v1.fields]]
name = "earth_radius_m"
type = "Float64"
causality = "parameter"
shape = []
required = false
unit = "m"
meaning = "Spherical Earth radius of the local geodetic conversion."

[capabilities.barometer_v1]
summary = "Latest barometer reading."
[[capabilities.barometer_v1.fields]]
name = "baro_pressure_pa"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "Pa"
meaning = "Static pressure."
[[capabilities.barometer_v1.fields]]
name = "baro_temperature_c"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "degC"
meaning = "Sensor temperature."
[[capabilities.barometer_v1.fields]]
name = "baro_altitude_m"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "m"
meaning = "Up-positive altitude above the ground plane."
[[capabilities.barometer_v1.fields]]
name = "baro_climb_rate_mps"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "m/s"
meaning = "Up-positive climb rate."

[capabilities.external_wrench_v1]
summary = "Host-supplied non-gravity wrench acting on the vehicle."
[[capabilities.external_wrench_v1.fields]]
name = "external_force_frd"
type = "Float64"
causality = "input"
shape = [3]
required = true
start = "finite"
unit = "N"
frame = "body FRD, applied at the combined CG"
meaning = "Added to the plant's own forces. Zero is no effect. Held between communication points."
[[capabilities.external_wrench_v1.fields]]
name = "external_moment_frd"
type = "Float64"
causality = "input"
shape = [3]
required = true
start = "finite"
unit = "N.m"
frame = "body FRD, about the combined CG"
meaning = "Added to the plant's own moments. Zero is no effect. Held between communication points."

[capabilities.rangefinder_v1]
summary = "Latest rangefinder reading (a rangefinder peripheral)."
[[capabilities.rangefinder_v1.fields]]
name = "rangefinder_distance_m"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "m"
meaning = "Slant range along the boresight, as the device reports it: 0 below its minimum range, beyond its maximum more than the maximum, -1 for no return."
[[capabilities.rangefinder_v1.fields]]
name = "rangefinder_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when the reading is valid (a return within range), else 0."

[capabilities.airspeed_v1]
summary = "Latest differential-pressure airspeed sensor reading (pitot-static)."
[[capabilities.airspeed_v1.fields]]
name = "airspeed_differential_pressure_pa"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "Pa"
meaning = "Total minus static pressure; negative for reverse flow."
[[capabilities.airspeed_v1.fields]]
name = "airspeed_temperature_k"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "K"
meaning = "Static air temperature at the sensor."
[[capabilities.airspeed_v1.fields]]
name = "airspeed_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a sample has been delivered, else 0."

[capabilities.optical_flow_v1]
summary = "Latest optical flow reading."
[[capabilities.optical_flow_v1.fields]]
name = "flow_rate_xy"
type = "Float64"
causality = "output"
shape = [2]
required = true
unit = "rad/s"
meaning = "Image flow rates about the sensor x and y axes (ArduPilot convention: x = -v_y/range + p, y = v_x/range + q)."
[[capabilities.optical_flow_v1.fields]]
name = "flow_body_rate_xy"
type = "Float64"
causality = "output"
shape = [2]
required = false
unit = "rad/s"
meaning = "Sensor x and y angular rates the flow includes."
[[capabilities.optical_flow_v1.fields]]
name = "flow_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a surface is in range (quality good), else 0."

[capabilities.rpm_v1]
summary = "Latest shaft speeds (an RPM sensor per shaft)."
[[capabilities.rpm_v1.fields]]
name = "rpm"
type = "Float64"
causality = "output"
shape = ["n"]
required = true
unit = "rev/min"
meaning = "Element k: shaft k (rotor k of a multirotor, rear wheels of a rover)."
[[capabilities.rpm_v1.fields]]
name = "rpm_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a sample has been delivered, else 0."

[capabilities.battery_v1]
summary = "Battery pack and power module: measured voltage and current."
[[capabilities.battery_v1.fields]]
name = "battery_voltage_v"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "V"
meaning = "Measured pack terminal voltage."
[[capabilities.battery_v1.fields]]
name = "battery_current_a"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "A"
meaning = "Measured discharge current."
[[capabilities.battery_v1.fields]]
name = "battery_consumed_ah"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "A.h"
meaning = "Charge drawn since the start (truth)."
[[capabilities.battery_v1.fields]]
name = "battery_remaining"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "State of charge, 0..1 (truth; a smart battery reports it)."
[[capabilities.battery_v1.fields]]
name = "battery_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a sample has been delivered, else 0."

[capabilities.temperature_v1]
summary = "Latest temperature sensor reading."
[[capabilities.temperature_v1.fields]]
name = "temperature_k"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "K"
meaning = "Temperature at the sensor."
[[capabilities.temperature_v1.fields]]
name = "temperature_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a sample has been delivered, else 0."

[capabilities.external_ahrs_v1]
summary = "Latest external AHRS/INS solution."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_quaternion"
type = "Float64"
causality = "output"
shape = [4]
required = true
unit = "1"
meaning = "Scalar-first quaternion, body FRD to NED."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_rate_frd"
type = "Float64"
causality = "output"
shape = [3]
required = false
unit = "rad/s"
meaning = "Body angular rate."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_accel_frd"
type = "Float64"
causality = "output"
shape = [3]
required = false
unit = "m/s2"
meaning = "Specific force at the unit."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_position_ned"
type = "Float64"
causality = "output"
shape = [3]
required = false
unit = "m"
meaning = "Unit position from the geodetic origin."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_velocity_ned"
type = "Float64"
causality = "output"
shape = [3]
required = false
unit = "m/s"
meaning = "Unit velocity."
[[capabilities.external_ahrs_v1.fields]]
name = "ahrs_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a solution has been delivered, else 0."

[capabilities.visual_odometry_v1]
summary = "Latest visual odometry pose (odometry frame: NED at the origin)."
[[capabilities.visual_odometry_v1.fields]]
name = "odometry_position_ned"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m"
meaning = "Camera position."
[[capabilities.visual_odometry_v1.fields]]
name = "odometry_velocity_ned"
type = "Float64"
causality = "output"
shape = [3]
required = false
unit = "m/s"
meaning = "Camera velocity."
[[capabilities.visual_odometry_v1.fields]]
name = "odometry_quaternion"
type = "Float64"
causality = "output"
shape = [4]
required = false
unit = "1"
meaning = "Scalar-first quaternion, body FRD to the odometry frame."
[[capabilities.visual_odometry_v1.fields]]
name = "odometry_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a pose has been delivered, else 0."

[capabilities.beacon_v1]
summary = "Latest beacon (indoor positioning) fix (beacon frame: NED at the origin)."
[[capabilities.beacon_v1.fields]]
name = "beacon_position_ned"
type = "Float64"
causality = "output"
shape = [3]
required = true
unit = "m"
meaning = "Tag position."
[[capabilities.beacon_v1.fields]]
name = "beacon_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when a fix has been delivered, else 0."

[capabilities.precision_landing_v1]
summary = "Latest landing-target sighting."
[[capabilities.precision_landing_v1.fields]]
name = "landing_target_angle"
type = "Float64"
causality = "output"
shape = [2]
required = true
unit = "rad"
meaning = "atan(x/z), atan(y/z) of the target in the camera axes (z the boresight)."
[[capabilities.precision_landing_v1.fields]]
name = "landing_target_distance_m"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "m"
meaning = "Distance to the target."
[[capabilities.precision_landing_v1.fields]]
name = "landing_target_valid"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "1 when the target is in view, else 0."

[capabilities.payload_actuation_v1]
summary = "Pulse-width commands of the payloads' servos (gripper, winch, parachute, sprayer, landing gear, gimbal)."
[[capabilities.payload_actuation_v1.fields]]
name = "aux_pwm"
type = "Float64"
causality = "input"
shape = ["n"]
required = true
start = "finite"
unit = "us"
meaning = "Element k is host servo output 9+k (ArduPilot SERVO9...). Unused elements keep their start value."

[capabilities.fuel_v1]
summary = "Fuel flow and level of an onboard generator's tank."
[[capabilities.fuel_v1.fields]]
name = "fuel_flow_lph"
type = "Float64"
causality = "output"
shape = []
required = true
unit = "l/h"
meaning = "Fuel flow out of the tank."
[[capabilities.fuel_v1.fields]]
name = "fuel_level"
type = "Float64"
causality = "output"
shape = []
required = false
unit = "1"
meaning = "Fuel left, fraction of the tank."

# An FMU without the marker is accepted only when the host explicitly selects
# this profile; the checker then warns. It describes the exports of FastDyn's
# FastDyn.Copter/Rover/Plane wrappers before migration. Removal is decided
# once every supported producer declares the marker.
[profiles.fastdyn_legacy]
summary = "FastDyn wrappers and CP Models exports that predate the marker."
capabilities = ["pwm_actuation_v1", "imu_v1", "magnetometer_v1", "gnss_v1", "barometer_v1"]
